server {
 listen 127.0.0.1:9122;
 server_name tg-beta.absoluteparallax.com;
 root /deploy/current;
 server_tokens off;
 add_header X-Content-Type-Options nosniff always;
 # Nginx decodes/normalizes single-encoded paths before location selection.
 # Reject recursive encodings rather than allowing ambiguous paths into the SPA.
 if ($request_uri ~* "%25") { return 400; }
 # Deny raw descendants too: dot-segment normalization must not escape to SPA.
 if ($request_uri ~* "^(?:/|%2f)+(?:_|%5f)(?:d|%64)(?:e|%65)(?:p|%70)(?:l|%6c)(?:o|%6f)(?:y|%79)(?:/|%2f)") { return 404; }
 location = /_deploy { return 405; }
 location ^~ /_deploy/ { return 404; }
 location = /manifest.json { return 404; }
 location ~ (^|/)\. { return 404; }
 location = /_deployment.json { add_header Cache-Control "no-store"; add_header X-Content-Type-Options nosniff always; }
 location = /index.html { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; }
 location /assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; add_header X-Content-Type-Options nosniff always; }
 location / { try_files $uri $uri/ /index.html; }
}
