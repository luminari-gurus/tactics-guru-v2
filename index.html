<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#172033" />
    <link rel="icon" href="data:," />
    <title>Tactics Guru v2</title>
  </head>
  <body>
    <main id="game" aria-label="Tactics Guru game canvas" data-ready="false"></main>
    <aside id="fit-panel" aria-label="Proof scene diagnostics">
      <div class="fit-controls">
        <span id="fit-status" role="status" aria-live="polite">Loading</span>
        <button id="fit-restart" type="button" disabled>Restart proof scene</button>
        <img id="proof-portrait" alt="Fighter portrait" width="48" height="48" hidden />
      </div>
      <div class="fit-controls" aria-label="Occlusion fixtures">
        <button data-fixture="ground-behind" disabled>Ground: Behind</button>
        <button data-fixture="ground-front" disabled>Ground: In front</button>
        <button data-fixture="raised-behind" disabled>Raised: Behind</button>
        <button data-fixture="raised-front" disabled>Raised: In front</button>
      </div>
      <div class="fit-controls fit-opacity">
        <label for="tree-opacity">Tree opacity (unit behind)</label>
        <input id="tree-opacity" type="range" min="0" max="100" step="1" value="40" disabled />
        <span id="tree-opacity-value">40%</span>
      </div>
      <p id="board-caption">Elevated board · 4 × 4 · levels 0–2</p>
      <details>
        <summary>Measurements</summary>
        <button id="fit-snapshot" type="button">Refresh measurements</button>
        <pre id="fit-report">Refresh to capture current measurements.</pre>
      </details>
    </aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
