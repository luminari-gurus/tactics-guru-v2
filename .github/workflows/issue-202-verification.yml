name: Issue 202 fixture verification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: issue-202-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    # Temporary caller-approved hosted execution for PR 214 only.
    if: github.event.pull_request.number == 214 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        id: dependencies
        run: npm ci
      - name: Install lockfile Chromium and OS libraries
        id: browser
        run: npx --no-install playwright install --with-deps chromium
      - name: Record source and browser receipt
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: |
          mkdir -p tmp/issue202-ci
          git rev-parse HEAD > tmp/issue202-ci/source.txt
          node --version > tmp/issue202-ci/node.txt
          npx --no-install playwright --version > tmp/issue202-ci/playwright.txt
          node --input-type=module <<'JS' > tmp/issue202-ci/browser.json
          import { chromium } from '@playwright/test';
          const browser = await chromium.launch({ channel: 'chromium' });
          console.log(JSON.stringify({ version: browser.version(), executable: chromium.executablePath(), platform: process.platform, arch: process.arch }));
          await browser.close();
          JS
      - name: Verify orchestration contracts
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run test:verification
      - name: Verify exact fixture selection and plan
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          mkdir -p tmp/issue202-ci
          npm run verify:full -- --list > tmp/issue202-ci/full-plan.txt
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          const select = config => {
            const report = JSON.parse(execFileSync(process.execPath, ['node_modules/@playwright/test/cli.js', 'test', '-c', config, '--list', '--reporter=json'], { encoding: 'utf8' }));
            const cases = [];
            const walk = (suites, parents = []) => {
              for (const suite of suites) {
                const titles = [...parents, suite.title];
                for (const spec of suite.specs ?? []) for (const test of spec.tests) cases.push(JSON.stringify([test.projectName, spec.file, ...titles.slice(1), spec.title]));
                walk(suite.suites ?? [], titles);
              }
            };
            walk(report.suites);
            return cases.sort();
          };
          const combined = select('playwright.fixtures.config.ts');
          const individual = ['encounters', 'run-items', 'abilities'].flatMap(name => select(`playwright.${name}.config.ts`)).sort();
          assert.equal(combined.length, 57);
          assert.equal(new Set(combined).size, 57);
          assert.deepEqual(combined, individual);
          writeFileSync('tmp/issue202-ci/fixture-selection.json', JSON.stringify(combined, null, 2));
          JS
      - name: Combined fixtures (57 cases, one dev server)
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: tmp/issue202-ci/fixtures.json
        run: npm run test:fixtures -- --reporter=line,json --output=tmp/issue202-ci/fixture-artifacts
      - name: Production build with content and both typechecks
        id: build
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run build
      - name: Record updated toolchain and served build
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          node --input-type=module <<'JS'
          import { createHash } from 'node:crypto';
          import { readFileSync, readdirSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const walk = dir => readdirSync(dir, { withFileTypes: true }).flatMap(e => e.isDirectory() ? walk(join(dir, e.name)) : [join(dir, e.name)]);
          const files = ['package.json', 'package-lock.json', 'playwright.config.ts', 'playwright.fixtures.config.ts', 'playwright.encounters.config.ts', 'playwright.run-items.config.ts', 'playwright.abilities.config.ts', 'scripts/verify-full.mjs', ...walk('dist')];
          const versions = Object.fromEntries(['vite', 'rolldown', 'postcss', '@playwright/test'].map(name => [name, JSON.parse(readFileSync(`node_modules/${name}/package.json`, 'utf8')).version]));
          const hashes = Object.fromEntries(files.map(path => [path, createHash('sha256').update(readFileSync(path)).digest('hex')]));
          writeFileSync('tmp/issue202-ci/build-identity.json', JSON.stringify({ versions, hashes }, null, 2));
          JS
      - name: Focused npm command (one case, no posttests)
        if: ${{ !cancelled() && steps.browser.outcome == 'success' && steps.build.outcome == 'success' }}
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: tmp/issue202-ci/focused.json
        run: npm test -- tests/boot.spec.ts --project=desktop -g 'boots a Phaser scene' --reporter=line,json --output=tmp/issue202-ci/focused-artifacts
      - name: Check exact executed coverage
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          for (const [name, count] of [['fixtures', 57], ['focused', 1]]) {
            const report = JSON.parse(readFileSync(`tmp/issue202-ci/${name}.json`, 'utf8'));
            assert.equal(report.stats.expected, count, `${name} passing count`);
            for (const key of ['unexpected', 'flaky', 'skipped']) assert.equal(report.stats[key], 0, `${name} ${key}`);
          }
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-202-${{ github.event.pull_request.head.sha }}
          path: tmp/issue202-ci/
          if-no-files-found: warn
          retention-days: 14
  issue254-verify:
    name: verify
    if: github.event.pull_request.number == 260 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, tactics-browser]
    timeout-minutes: 360
    concurrency:
      group: tactics-browser-exclusive
      cancel-in-progress: false
    steps:
      - run: test ! -f "$RUNNER_TOOL_CACHE/issue208-unsafe-host"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run setup:browsers && npm run check:browsers
      - name: Record source and toolchain
        run: |
          mkdir -p verification-receipts/issue254
          git rev-parse HEAD > verification-receipts/issue254/source.txt
          node --version > verification-receipts/issue254/node.txt
          npx --no-install playwright --version > verification-receipts/issue254/playwright.txt
          uname -a > verification-receipts/issue254/host.txt
          git status --short > verification-receipts/issue254/status.txt
          sha256sum package-lock.json src/map/movement.ts src/domain/dungeon.ts tests/unit/overworldMap.test.ts tests/dungeon.spec.ts tests/dungeon-exploration.spec.ts tests/dungeon-lifecycle.spec.ts tests/overworld-map.spec.ts > verification-receipts/issue254/inputs.sha256
          node --input-type=module -e "import {chromium,webkit} from '@playwright/test'; for (const type of [chromium,webkit]) { const browser=await type.launch(); console.log(type.name(),browser.version(),type.executablePath()); await browser.close(); }" > verification-receipts/issue254/browsers.txt
      - run: npm run test:unit
      - run: npm run typecheck
      - id: build
        run: npm run build
      - name: Record served build identity
        if: ${{ steps.build.outcome == 'success' }}
        run: find dist -type f -print0 | sort -z | xargs -0 sha256sum > verification-receipts/issue254/build.sha256
      - name: Chromium exploration including lifecycle and overworld map
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: verification-receipts/issue254/chromium.json
        run: npx --no-install playwright test tests/dungeon-exploration.spec.ts tests/dungeon.spec.ts tests/dungeon-lifecycle.spec.ts tests/overworld-map.spec.ts --workers=1 --retries=0 --reporter=line,json --output=verification-receipts/issue254/chromium-artifacts
      - name: WebKit exploration including lifecycle
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: verification-receipts/issue254/webkit.json
        run: npx --no-install playwright test -c playwright.exploration.config.ts --workers=1 --retries=0 --reporter=line,json --output=verification-receipts/issue254/webkit-artifacts
      - name: WebKit overworld map
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: verification-receipts/issue254/webkit-overworld.json
        run: printf '%s\n' "import { defineConfig } from '@playwright/test';" "import base from './playwright.exploration.config';" "export default defineConfig({ ...base, testMatch: ['**/overworld-map.spec.ts'] });" > tmp-overworld-webkit.config.ts && npx --no-install playwright test -c tmp-overworld-webkit.config.ts --workers=1 --retries=0 --reporter=line,json --output=verification-receipts/issue254/webkit-overworld-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue254-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification-receipts/issue254/
          retention-days: 30
          if-no-files-found: warn
