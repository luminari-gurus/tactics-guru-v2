name: Issue 259 scoped repair qualification
on:
  push:
    branches: [branch/issue-259-repair-qualification]
    paths: [.github/workflows/issue-259-repair-qualification.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tactics-browser-exclusive
  cancel-in-progress: false
jobs:
  repairs:
    runs-on: [self-hosted, tactics-browser]
    timeout-minutes: 45
    env:
      VITE_POSTHOG_ENABLED: 'false'
    steps:
      - name: Check qualified host disposition
        run: test ! -f "$RUNNER_TOOL_CACHE/issue208-unsafe-host"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        timeout-minutes: 10
      - run: npm run setup:browsers && npm run check:browsers
        timeout-minutes: 10
      - name: Record source and candidate equivalence
        run: |
          mkdir -p verification-receipts/issue-259-repairs
          git rev-parse HEAD > verification-receipts/issue-259-repairs/source.txt
          git diff --name-only 30dc8acab59ad67ac48f074e3f9515eef2dcb504 HEAD > verification-receipts/issue-259-repairs/candidate-diff.txt
          test "$(cat verification-receipts/issue-259-repairs/candidate-diff.txt)" = '.github/workflows/issue-259-repair-qualification.yml'
          node --input-type=module -e "import {sourceIdentity} from './scripts/verification-report.mjs';import {writeFileSync} from 'node:fs';writeFileSync('verification-receipts/issue-259-repairs/source.json',JSON.stringify(sourceIdentity(process.cwd()),null,2));"
      - name: Build frozen repair candidate
        id: build
        run: npm run build
        timeout-minutes: 10
      - name: Chromium repaired journeys across all profiles
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: verification-receipts/issue-259-repairs/chromium.json
        run: npx --no-install playwright test tests/run-progression.spec.ts tests/dungeon.spec.ts tests/dungeon-exploration.spec.ts -g 'legal defeat reload|testing dungeon legally|dungeon battle undo|real traversal, art' --workers=1 --retries=0 --reporter=line,json --output verification-receipts/issue-259-repairs/chromium-artifacts
        timeout-minutes: 15
      - name: WebKit acceptance repaired menu resume
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: verification-receipts/issue-259-repairs/webkit-acceptance.json
        run: npx --no-install playwright test -c playwright.device-acceptance.config.ts tests/run-progression.spec.ts -g 'legal defeat reload' --workers=1 --retries=0 --reporter=line,json --output verification-receipts/issue-259-repairs/webkit-acceptance-artifacts
        timeout-minutes: 10
      - name: WebKit exploration repaired readiness and traversal
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: verification-receipts/issue-259-repairs/webkit-exploration.json
        run: npx --no-install playwright test -c playwright.exploration.config.ts tests/dungeon.spec.ts tests/dungeon-exploration.spec.ts -g 'testing dungeon legally|dungeon battle undo|real traversal, art' --workers=1 --retries=0 --reporter=line,json --output verification-receipts/issue-259-repairs/webkit-exploration-artifacts
        timeout-minutes: 15
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-259-repairs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            verification-receipts/issue-259-repairs/
            verification-receipts/browser-environment/
          retention-days: 30
          if-no-files-found: warn
