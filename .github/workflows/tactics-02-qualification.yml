name: Tactics 02 isolated qualification
on:
  push:
    branches: [work/tactics-02-qualification-20261105]
    paths: ['.github/workflows/tactics-02-qualification.yml']
permissions:
  contents: read
concurrency:
  group: tactics-02-qualification
  cancel-in-progress: false
jobs:
  qualify:
    if: github.repository == 'luminari-gurus/tactics-guru-v2' && github.ref == 'refs/heads/work/tactics-02-qualification-20261105'
    runs-on: [tactics-02-qualification]
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Assert dedicated host and user
        run: |
          test "$RUNNER_NAME" = unraid-tactics-02
          test "$(id -un)" = actions
          test "$(uname -m)" = x86_64
          test ! -f "$RUNNER_TOOL_CACHE/issue208-unsafe-host"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify source identity
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git log -1 --format='%H %s'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install lockfile dependencies
        run: npm ci
        timeout-minutes: 10
      - name: Install browser binaries as the service user
        run: npm run setup:browsers
        timeout-minutes: 10
      - name: Check Chromium and WebKit
        run: npm run check:browsers
      - name: Verify browser diagnostics tooling
        run: node --test tests/tooling/browser-diagnostics.test.mjs
      - name: Build production app with content and typechecks
        run: npm run build
      - name: Record qualification source and build
        run: |
          mkdir -p verification-receipts/tactics-02
          {
            printf 'Runner: %s\nUser: %s\nSource: %s\n' "$RUNNER_NAME" "$(id -un)" "$GITHUB_SHA"
            node --version
            npx --no-install playwright --version
            cat /etc/os-release
            sha256sum package-lock.json playwright.setup-smoke.config.ts tests/boot.spec.ts
          } | tee verification-receipts/tactics-02/environment.txt
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > verification-receipts/tactics-02/build.sha256
          node --input-type=module <<'JS' > verification-receipts/tactics-02/browsers.json
          import { chromium, webkit } from '@playwright/test';
          const results = [];
          for (const type of [chromium, webkit]) {
            const browser = await type.launch(type === chromium ? { channel: 'chromium' } : {});
            results.push({ engine: type.name(), version: browser.version(), executable: type.executablePath() });
            await browser.close();
          }
          console.log(JSON.stringify(results, null, 2));
          JS
      - name: Run Chromium and WebKit Phaser smoke
        run: npm run test:browser-smoke -- --diagnostics --workers=1
      - name: Assert exactly two passing browser smoke cases
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readdirSync, readFileSync } from 'node:fs';
          const roots = readdirSync('verification-receipts/browser-runs');
          assert.equal(roots.length, 1);
          const report = JSON.parse(readFileSync('verification-receipts/browser-runs/' + roots[0] + '/results.json', 'utf8'));
          assert.equal(report.stats.expected, 2);
          for (const key of ['unexpected', 'flaky', 'skipped']) assert.equal(report.stats[key], 0, key);
          console.log('Two passed: Chromium desktop and WebKit iPhone emulation. No failures, retries, or skips.');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tactics-02-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification-receipts/
          retention-days: 7
          if-no-files-found: warn
