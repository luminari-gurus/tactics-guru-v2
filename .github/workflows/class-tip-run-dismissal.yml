name: Class tip dismissal verification
on:
  pull_request:
    paths: ['src/**', 'tests/**', 'scripts/**', '*config*', 'package*.json', '.github/workflows/class-tip-run-dismissal.yml']
permissions:
  contents: read
concurrency:
  group: tactics-browser-tactics-browser-02
  queue: max
  cancel-in-progress: false
jobs:
  dismissal:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/class-tip-run-dismissal'
    runs-on: [self-hosted, tactics-browser, tactics-browser-02]
    timeout-minutes: 20
    steps:
      - name: Check host disposition
        run: test ! -f "$RUNNER_TOOL_CACHE/issue208-unsafe-host"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run setup:browsers && npm run check:browsers
      - name: Record tested source
        run: |
          mkdir -p verification-receipts/class-tip-dismissal
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          import { sourceIdentity } from './scripts/verification-report.mjs';
          writeFileSync('verification-receipts/class-tip-dismissal/source.json', JSON.stringify({
            source: sourceIdentity(process.cwd()), node: process.version, runner: process.env.RUNNER_NAME,
            conditions: 'Production preview; desktop and touch-device emulation; one worker, zero retries. No physical-device or performance claim.'
          }, null, 2));
          JS
      - name: Build the application
        id: build
        run: npm run build
      - name: Verify turns, settings, run encounters and saved dungeon resume on Chromium
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:browser -- -c playwright.regression.config.ts tests/battle-loop.spec.ts tests/battle-animations.spec.ts tests/main-menu.spec.ts tests/run-progression.spec.ts tests/dungeon-exploration.spec.ts -g 'player HUD class guidance|class guidance retains|main menu: class guidance|class guidance: unsaved dungeon|a second dungeon encounter|legal run outcomes' --diagnostics
      - name: Verify battle and run guidance on iPhone WebKit
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:browser -- -c playwright.device-acceptance.config.ts tests/battle-loop.spec.ts tests/main-menu.spec.ts tests/run-progression.spec.ts -g 'player HUD class guidance|main menu: class guidance|legal run outcomes' --diagnostics
      - name: Verify saved dungeon dismissal on iPhone WebKit
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:browser -- -c playwright.exploration.config.ts tests/dungeon-exploration.spec.ts --project=portrait-webkit --project=landscape-webkit -g 'class guidance: unsaved dungeon|a second dungeon encounter' --diagnostics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: class-tip-dismissal-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification-receipts/
          retention-days: 14
          if-no-files-found: warn
