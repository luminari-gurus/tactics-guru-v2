name: Issue 425 critical impact
on:
  push:
    branches: [work/issue-425-critical-impact]
    paths: ['src/**', 'tests/**', 'scripts/**', '*config*', 'package*.json', '.github/workflows/issue-425-critical-impact.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tactics-browser-tactics-browser-02
  queue: max
  cancel-in-progress: false
jobs:
  critical-impact:
    if: github.repository == 'luminari-gurus/tactics-guru-v2' && github.ref == 'refs/heads/work/issue-425-critical-impact'
    runs-on: [self-hosted, tactics-browser, tactics-browser-02]
    timeout-minutes: 30
    steps:
      - name: Check host disposition
        run: test ! -f "$RUNNER_TOOL_CACHE/issue208-unsafe-host"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run setup:browsers && npm run check:browsers
      - name: Record tested source
        run: |
          mkdir -p verification-receipts/issue-425
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          import { sourceIdentity } from './scripts/verification-report.mjs';
          writeFileSync('verification-receipts/issue-425/source.json', JSON.stringify({
            source: sourceIdentity(process.cwd()), node: process.version, runner: process.env.RUNNER_NAME,
            conditions: 'Production preview at /; browser/device emulation; one worker, zero retries; shared host load and caches not independently controlled. No performance claim.'
          }, null, 2));
          JS
      - name: Build the application
        id: build
        run: npm run build
      - name: Verify critical impacts and existing signatures on desktop and Pixel Chromium
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          npm run test:browser -- -c playwright.regression.config.ts tests/battle-animations.spec.ts -g 'critical impact:|real controls, travel/impact|feedback matches resolved events|elevated target remains' --diagnostics
      - name: Verify critical impacts on iPhone WebKit
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          npm run test:browser -- -c playwright.critical-impact.config.ts --diagnostics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-425-critical-impact-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification-receipts/
          retention-days: 14
          if-no-files-found: warn
