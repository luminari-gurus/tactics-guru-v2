name: Issue 200 resumable serial verification
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Bounded qualification, partial artifact pilot, or serial capture
        type: choice
        options: [qualify, pilot, capture, battle-compare]
        default: qualify
      batches:
        description: Optional comma-separated batch IDs; empty capture selects the full plan
        type: string
        default: ''
      conditions:
        description: Host workloads and cache conditions; coordinate unrelated workloads
        type: string
        default: 'Persistent runner; background workloads not independently verified'
permissions:
  contents: read
  actions: read
concurrency:
  group: tactics-browser-exclusive
  cancel-in-progress: false
env:
  SERIAL_MODE: ${{ inputs.mode }}
  SERIAL_BATCHES: ${{ inputs.batches }}
  SERIAL_CONDITIONS: ${{ inputs.conditions }}
jobs:
  qualify:
    if: github.repository == 'luminari-gurus/tactics-guru-v2' && (inputs.mode == 'qualify' || inputs.mode == 'battle-compare') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/work/issue-200-verification-timings' || github.ref == 'refs/heads/work/issue-208-serial-batches' || github.ref == 'refs/heads/work/issue-203-browser-coverage')
    runs-on: [self-hosted, tactics-browser]
    timeout-minutes: 25
    steps:
      - name: Check host disposition before qualification
        run: test ! -f "$RUNNER_TOOL_CACHE/issue208-unsafe-host"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        timeout-minutes: 10
      - run: npm run setup:browsers && npm run check:browsers
        timeout-minutes: 5
      - run: npm run test:verification-tooling && npm run test:verification-batches && npm run test:verification
      - run: node --test tests/tooling/browser-diagnostics.test.mjs
      - run: npm run build && npm run test:browser-smoke
      - run: node --test tests/tooling/verification-browser.test.mjs
      - name: Preserve the qualification timing receipt and comparison
        env:
          RECEIPT: verification-receipts/timings/self-hosted-qualification-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          npm run measure:verification -- --stages tooling,typecheck-app,typecheck-domain --out "$RECEIPT" --conditions 'Qualification only; not a full baseline'
          npm run --silent measure:verification -- compare "$RECEIPT/report.json" "$RECEIPT/report.json" > "$RECEIPT/self-comparison.json"
          cat "$RECEIPT/summary.md" >> "$GITHUB_STEP_SUMMARY"
        timeout-minutes: 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue208-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification-receipts/
          retention-days: 30
          if-no-files-found: warn
  prepare:
    if: github.repository == 'luminari-gurus/tactics-guru-v2' && (inputs.mode == 'pilot' || inputs.mode == 'capture') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/work/issue-208-serial-batches' || github.ref == 'refs/heads/work/issue-203-browser-coverage')
    runs-on: [self-hosted, tactics-browser]
    timeout-minutes: 35
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
      bundle: issue208-build-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Record setup start and check host disposition
        run: |
          echo "SERIAL_JOB_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          test ! -f "$RUNNER_TOOL_CACHE/issue208-unsafe-host"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        timeout-minutes: 10
      - run: npm run setup:browsers && npm run check:browsers
        timeout-minutes: 5
      - run: npm run test:verification-tooling && npm run test:verification-batches
        timeout-minutes: 5
      - name: Discover exact coverage and build the ordinary artifact once
        id: prepare
        run: timeout --signal=TERM --kill-after=15s 15m npm run verify:batches -- prepare verification-receipts/serial/bundle
        timeout-minutes: 16
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue208-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification-receipts/serial/bundle/
          retention-days: 30
          compression-level: 1
          if-no-files-found: warn
  batch:
    needs: prepare
    if: always() && !cancelled() && needs.prepare.outputs.matrix != ''
    runs-on: [self-hosted, tactics-browser]
    timeout-minutes: 85
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: batch (${{ matrix.id }})
    env:
      SERIAL_BATCH_ID: ${{ matrix.id }}
    steps:
      - name: Record setup start and check host disposition
        run: |
          echo "SERIAL_JOB_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          test ! -f "$RUNNER_TOOL_CACHE/issue208-unsafe-host"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        timeout-minutes: 10
      - run: npm run setup:browsers && npm run check:browsers
        timeout-minutes: 5
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.bundle }}
          path: verification-receipts/serial/bundle/
      - name: Verify and execute this batch with its independent budget
        run: |
          timeout --signal=TERM --kill-after=15s 65m npm run verify:batches -- run \
            verification-receipts/serial/bundle "$SERIAL_BATCH_ID" "verification-receipts/serial/jobs/$SERIAL_BATCH_ID"
        timeout-minutes: 66
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue208-receipts-${{ github.run_id }}-${{ matrix.id }}-${{ github.run_attempt }}
          path: verification-receipts/serial/jobs/${{ matrix.id }}/
          retention-days: 30
          compression-level: 1
          if-no-files-found: warn
  aggregate:
    name: Serial verification aggregate
    needs: [prepare, batch]
    if: always() && github.repository == 'luminari-gurus/tactics-guru-v2' && (inputs.mode == 'pilot' || inputs.mode == 'capture') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/work/issue-208-serial-batches' || github.ref == 'refs/heads/work/issue-203-browser-coverage')
    runs-on: [self-hosted, tactics-browser]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.bundle }}
          path: verification-receipts/serial/bundle/
      - uses: actions/download-artifact@v4
        with:
          pattern: issue208-receipts-${{ github.run_id }}-*
          path: verification-receipts/serial/downloads/
      - name: Account for every expected batch, all attempts and scheduler overhead
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verification-batches.mjs aggregate verification-receipts/serial/bundle verification-receipts/serial/downloads verification-receipts/serial/aggregate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue208-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification-receipts/serial/aggregate/
          retention-days: 30
          if-no-files-found: warn

  battle-compare:
    needs: qualify
    if: always() && inputs.mode == 'battle-compare' && github.repository == 'luminari-gurus/tactics-guru-v2' && github.ref == 'refs/heads/work/issue-203-browser-coverage'
    runs-on: [self-hosted, tactics-browser]
    timeout-minutes: 15
    env:
      PLAYWRIGHT_SERVER_MODE: preview
      PLAYWRIGHT_BASE_PATH: /
      PLAYWRIGHT_TELEMETRY_DEV: 'false'
    steps:
      - name: Check host and prepare durable comparison output
        run: |
          test ! -f "$RUNNER_TOOL_CACHE/issue208-unsafe-host"
          comparison_receipts="$RUNNER_TEMP/issue203-comparison-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$comparison_receipts"
          echo "RECEIPTS=$comparison_receipts" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: 958bbd90546e1305aab10e370d5555a1d7c9a43a
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Build and identify literal main base
        run: |
          for comparison_key in "${!VITE_@}"; do unset "$comparison_key"; done
          unset FIT_URL POSTHOG_SOURCEMAPS PLAYWRIGHT_JSON_OUTPUT_FILE
          npm ci
          npm run check:browsers > "$RECEIPTS/base-environment.log" 2>&1
          npm run build > "$RECEIPTS/base-build.log" 2>&1
          node --input-type=module -e 'import {writeFileSync} from "node:fs"; import os from "node:os"; import {sourceIdentity,digest} from "./scripts/verification-report.mjs"; import {inventory} from "./scripts/verification-batches.mjs"; const files=inventory("dist"); writeFileSync(process.env.RECEIPTS+"/base-source.json",JSON.stringify({source:sourceIdentity(process.cwd()),environment:{node:process.version,runner:process.env.RUNNER_NAME,platform:process.platform,arch:process.arch,release:os.release(),cpu:os.cpus()[0]?.model,memoryBytes:os.totalmem(),loadAverage:os.loadavg(),conditions:process.env.SERIAL_CONDITIONS},files,buildHash:digest(JSON.stringify(files))},null,2));'
      - name: Observe unchanged case on literal base without retries or tracing
        continue-on-error: true
        run: |
          for comparison_key in "${!VITE_@}"; do unset "$comparison_key"; done
          unset FIT_URL POSTHOG_SOURCEMAPS PLAYWRIGHT_JSON_OUTPUT_FILE
          npx --no-install playwright test tests/battle-persistence.spec.ts --project=mobile-landscape -g '^default Move Continue is read-only and confirmed movement keeps the remaining-action flow$' --workers=1 --retries=0 --reporter=json > "$RECEIPTS/base.json" 2> "$RECEIPTS/base.err"
      - name: Retain base failure artifacts before the next checkout
        if: always() && env.RECEIPTS != ''
        run: test ! -d test-results || cp -R test-results "$RECEIPTS/base-artifacts"
      - uses: actions/checkout@v4
        if: always() && env.RECEIPTS != ''
        with:
          ref: 5bd53985aa5f3ded04b6853e5ce718165e289094
          fetch-depth: 0
          persist-credentials: false
      - name: Build and identify the failed-capture source
        run: |
          for comparison_key in "${!VITE_@}"; do unset "$comparison_key"; done
          unset FIT_URL POSTHOG_SOURCEMAPS PLAYWRIGHT_JSON_OUTPUT_FILE
          npm ci
          npm run check:browsers > "$RECEIPTS/candidate-environment.log" 2>&1
          npm run build > "$RECEIPTS/candidate-build.log" 2>&1
          node --input-type=module -e 'import {writeFileSync} from "node:fs"; import os from "node:os"; import {sourceIdentity,digest} from "./scripts/verification-report.mjs"; import {inventory} from "./scripts/verification-batches.mjs"; const files=inventory("dist"); writeFileSync(process.env.RECEIPTS+"/candidate-source.json",JSON.stringify({source:sourceIdentity(process.cwd()),environment:{node:process.version,runner:process.env.RUNNER_NAME,platform:process.platform,arch:process.arch,release:os.release(),cpu:os.cpus()[0]?.model,memoryBytes:os.totalmem(),loadAverage:os.loadavg(),conditions:process.env.SERIAL_CONDITIONS},files,buildHash:digest(JSON.stringify(files))},null,2));'
      - name: Observe same case on the failed-capture source without retries or tracing
        continue-on-error: true
        run: |
          for comparison_key in "${!VITE_@}"; do unset "$comparison_key"; done
          unset FIT_URL POSTHOG_SOURCEMAPS PLAYWRIGHT_JSON_OUTPUT_FILE
          npx --no-install playwright test tests/battle-persistence.spec.ts --project=mobile-landscape -g '^default Move Continue is read-only and confirmed movement keeps the remaining-action flow$' --workers=1 --retries=0 --reporter=json > "$RECEIPTS/candidate.json" 2> "$RECEIPTS/candidate.err"
      - name: Retain candidate failure artifacts
        if: always() && env.RECEIPTS != ''
        run: test ! -d test-results || cp -R test-results "$RECEIPTS/candidate-artifacts"
      - name: Preserve both observations without converting the original failure to a pass
        if: always() && env.RECEIPTS != ''
        run: |
          node --input-type=module -e 'import {readFileSync,writeFileSync} from "node:fs"; const reports=Object.fromEntries(["base","candidate"].map(name=>[name,JSON.parse(readFileSync(process.env.RECEIPTS+"/"+name+".json"))])); for(const r of Object.values(reports))if(r.stats.expected+r.stats.unexpected+r.stats.skipped!==1||r.errors.length)throw Error("Incomplete comparison"); writeFileSync(process.env.RECEIPTS+"/summary.json",JSON.stringify({purpose:"Exact-base attribution only; original full-capture failure remains failed",results:Object.fromEntries(Object.entries(reports).map(([name,r])=>[name,r.stats]))},null,2));'
      - uses: actions/upload-artifact@v4
        if: always() && env.RECEIPTS != ''
        with:
          name: issue203-base-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RECEIPTS }}/
          retention-days: 30
          if-no-files-found: warn
