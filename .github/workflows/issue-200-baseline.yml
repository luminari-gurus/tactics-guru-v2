name: Issue 200 initial-readiness comparison
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tactics-browser-exclusive
  cancel-in-progress: false
jobs:
  readiness:
    if: github.repository == 'luminari-gurus/tactics-guru-v2' && github.ref == 'refs/heads/work/issue-200-initial-readiness'
    runs-on: [self-hosted, tactics-browser]
    timeout-minutes: 15
    steps:
      - run: test ! -f "$RUNNER_TOOL_CACHE/issue208-unsafe-host"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run setup:browsers && npm run check:browsers
      - run: npm run build
      - name: Compare tracing modes on the unchanged application
        run: |
          mkdir -p verification-receipts/readiness
          node --input-type=module <<'JS'
          import {writeFileSync} from 'node:fs';
          import {resolve} from 'node:path';
          import {sourceIdentity} from './scripts/verification-report.mjs';
          writeFileSync('verification-receipts/readiness/source.json',JSON.stringify(sourceIdentity(process.cwd()),null,2));
          for(const mode of ['screenshots','off','snapshots']) {
            const trace = mode==='off'?'off':{mode:'retain-on-failure',screenshots:mode==='screenshots',snapshots:true,sources:true};
            writeFileSync(`verification-receipts/readiness/${mode}.config.ts`, `import base from ${JSON.stringify(resolve('playwright.config.ts'))}; export default {...base,testDir:${JSON.stringify(resolve('tests'))},use:{...base.use,trace:${JSON.stringify(trace)}}};`);
          }
          JS
          result=0
          for mode in screenshots off snapshots; do
            PLAYWRIGHT_JSON_OUTPUT_FILE="verification-receipts/readiness/$mode.json" npx --no-install playwright test -c "verification-receipts/readiness/$mode.config.ts" tests/audio.spec.ts --project=desktop -g 'the test tone plays only' --repeat-each=3 --workers=1 --retries=0 --reporter=list,json --output="verification-receipts/readiness/$mode-artifacts" || result=1
          done
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue200-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification-receipts/readiness/
          retention-days: 30
