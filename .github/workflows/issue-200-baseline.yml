name: Issue 200 focused stalled-audio validation
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact trusted source commit to test
        type: string
        default: f33e31a
      selection:
        type: choice
        options: [reproduce, diagnose, startup, qualify]
        default: reproduce
permissions:
  contents: read
concurrency:
  group: tactics-browser-exclusive
  cancel-in-progress: false
jobs:
  audio:
    if: github.repository == 'luminari-gurus/tactics-guru-v2' && github.ref == 'refs/heads/work/issue-200-stalled-audio'
    runs-on: [self-hosted, tactics-browser]
    timeout-minutes: 15
    steps:
      - name: Check runner disposition
        run: test ! -f "$RUNNER_TOOL_CACHE/issue208-unsafe-host"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run setup:browsers && npm run check:browsers
      - run: npm run build
      - name: Record source identity
        run: |
          mkdir -p verification-receipts/audio
          node --input-type=module <<'JS'
          import { sourceIdentity } from './scripts/verification-report.mjs';
          import { writeFileSync } from 'node:fs';
          writeFileSync('verification-receipts/audio/source.json', JSON.stringify({source:sourceIdentity(process.cwd()),node:process.version,platform:process.platform,arch:process.arch},null,2));
          JS
      - name: Reproduce exact landscape case three times without retries
        if: inputs.selection == 'reproduce'
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: verification-receipts/audio/reproduction.json
        run: npx --no-install playwright test tests/audio.spec.ts --project=mobile-landscape -g 'a stalled tone request' --repeat-each=3 --workers=1 --retries=0 --trace=retain-on-failure --reporter=list,json --output=verification-receipts/audio/reproduction
      - name: Diagnose preceding audio sequence in landscape
        if: inputs.selection == 'diagnose'
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: verification-receipts/audio/diagnosis.json
        run: npx --no-install playwright test tests/audio.spec.ts --project=mobile-landscape --workers=1 --retries=0 --trace=retain-on-failure --reporter=list,json --output=verification-receipts/audio/diagnosis
      - name: Compare initial desktop audio readiness three times
        if: inputs.selection == 'startup'
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: verification-receipts/audio/startup.json
        run: npx --no-install playwright test tests/audio.spec.ts --project=desktop -g '^the test tone plays only' --repeat-each=3 --workers=1 --retries=0 --trace=retain-on-failure --reporter=list,json --output=verification-receipts/audio/startup
      - name: Qualify affected audio consumers on all Chromium profiles
        if: inputs.selection == 'qualify'
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: verification-receipts/audio/qualification.json
        run: npx --no-install playwright test tests/audio.spec.ts tests/lifecycle.spec.ts --workers=1 --retries=0 --trace=retain-on-failure --reporter=list,json --output=verification-receipts/audio/qualification
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue200-audio-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification-receipts/audio/
          retention-days: 30
