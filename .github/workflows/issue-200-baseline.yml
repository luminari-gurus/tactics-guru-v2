name: Issue 200 resumable serial verification
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Qualified VM (requires its unique runner label)
        type: choice
        options: [tactics-browser-01, tactics-browser-02]
        default: tactics-browser-01
      mode:
        description: Qualification, serial pilot, two-runner pilot, matched pair, or serial capture
        type: choice
        options: [qualify, pilot, parallel-pilot, serial-pair, parallel-pair, capture]
        default: qualify
      batches:
        description: Optional comma-separated batch IDs; empty capture selects the full plan
        type: string
        default: ''
      conditions:
        description: Host workloads and cache conditions; coordinate unrelated workloads
        type: string
        default: 'Persistent runner; background workloads not independently verified'
      extra_job:
        description: Optional extra job on the dispatched ref; does not start serial batches
        type: choice
        options: [none, full-verify]
        default: none
  # Agents with contents:write but not Actions dispatch can start a full capture
  # by bumping this token file. Serial-batch jobs ignore push events.
  # branches-ignore keeps a merge of this path from starting a ~7h run on main.
  push:
    branches-ignore:
      - main
    paths:
      - '.github/full-verify-request'
permissions:
  contents: read
  actions: read
concurrency:
  # Reserve one VM across job boundaries; the other VM remains available.
  # Push-triggered full verification has no inputs and uses VM 01.
  group: tactics-browser-${{ (startsWith(inputs.mode, 'parallel-') || inputs.mode == 'serial-pair') && inputs.extra_job == 'none' && 'parallel-pilot' || inputs.runner || 'tactics-browser-01' }}
  queue: max
  cancel-in-progress: false
env:
  # The pilot compares exact runtime versions across separate runner tool caches.
  PILOT_NODE_VERSION: '24.22.2'
  SERIAL_MODE: ${{ inputs.mode }}
  SERIAL_BATCHES: ${{ inputs.batches }}
  SERIAL_CONDITIONS: ${{ inputs.conditions }}
jobs:
  reject-dispatch:
    name: Reject unsupported verification dispatch
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (github.repository != 'luminari-gurus/tactics-guru-v2' ||
      (inputs.extra_job != 'full-verify' &&
      !(github.ref == 'refs/heads/main' ||
      (endsWith(inputs.mode, '-pair') && github.ref == 'refs/heads/work/issue-208-matched-pair') || github.ref == 'refs/heads/work/issue-208-serial-batches' ||
      (inputs.mode == 'qualify' && github.ref == 'refs/heads/work/issue-200-verification-timings') ||
      ((inputs.mode == 'pilot' || inputs.mode == 'parallel-pilot') &&
      github.ref == 'refs/heads/work/issue-208-parallel-pilot'))))
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 1
    steps:
      - name: Explain the supported refs
        run: |
          echo "::error::This ref does not support the selected verification mode. Dispatch from main, or see docs/serial-verification.md for supported branch and mode combinations."
          exit 1
  qualify:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'luminari-gurus/tactics-guru-v2' && inputs.mode == 'qualify' && inputs.extra_job != 'full-verify' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/work/issue-200-verification-timings' || (endsWith(inputs.mode, '-pair') && github.ref == 'refs/heads/work/issue-208-matched-pair') || github.ref == 'refs/heads/work/issue-208-serial-batches')
    runs-on: [self-hosted, tactics-browser, "${{ inputs.runner || 'tactics-browser-01' }}"]
    timeout-minutes: 25
    steps:
      - name: Check host disposition before qualification
        run: test ! -f "$RUNNER_TOOL_CACHE/issue208-unsafe-host"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        timeout-minutes: 10
      - run: npm run setup:browsers && npm run check:browsers
        timeout-minutes: 5
      - run: npm run test:verification-tooling && npm run test:verification-batches && npm run test:verification
      - run: node --test tests/tooling/browser-diagnostics.test.mjs
      - run: npm run build && npm run test:browser-smoke
      - run: node --test tests/tooling/verification-browser.test.mjs
      - name: Preserve the qualification timing receipt and comparison
        env:
          RECEIPT: verification-receipts/timings/self-hosted-qualification-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          npm run measure:verification -- --stages tooling,typecheck-app,typecheck-domain --out "$RECEIPT" --conditions 'Qualification only; not a full baseline'
          npm run --silent measure:verification -- compare "$RECEIPT/report.json" "$RECEIPT/report.json" > "$RECEIPT/self-comparison.json"
          cat "$RECEIPT/summary.md" >> "$GITHUB_STEP_SUMMARY"
        timeout-minutes: 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue208-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification-receipts/
          retention-days: 30
          if-no-files-found: warn
  prepare:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'luminari-gurus/tactics-guru-v2' && inputs.mode != 'qualify' && inputs.extra_job != 'full-verify' && (github.ref == 'refs/heads/main' || (endsWith(inputs.mode, '-pair') && github.ref == 'refs/heads/work/issue-208-matched-pair') || github.ref == 'refs/heads/work/issue-208-serial-batches' || ((inputs.mode == 'pilot' || inputs.mode == 'parallel-pilot') && github.ref == 'refs/heads/work/issue-208-parallel-pilot'))
    runs-on: [self-hosted, tactics-browser, "${{ (startsWith(inputs.mode, 'parallel-') || inputs.mode == 'serial-pair') && 'tactics-browser-01' || inputs.runner || 'tactics-browser-01' }}"]
    concurrency:
      group: ${{ (startsWith(inputs.mode, 'parallel-') || inputs.mode == 'serial-pair') && format('tactics-browser-{0}', 'tactics-browser-01') || format('issue208-prepare-{0}', github.run_id) }}
      queue: max
      cancel-in-progress: false
    timeout-minutes: 35
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
      bundle: issue208-build-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Record setup start and check host disposition
        run: |
          echo "SERIAL_JOB_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          test ! -f "$RUNNER_TOOL_CACHE/issue208-unsafe-host"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ (inputs.mode == 'pilot' || (startsWith(inputs.mode, 'parallel-') || inputs.mode == 'serial-pair')) && env.PILOT_NODE_VERSION || '24' }}
          cache: npm
      - run: npm ci
        timeout-minutes: 10
      - run: npm run setup:browsers && npm run check:browsers
        timeout-minutes: 5
      - run: npm run test:verification-tooling && npm run test:verification-batches
        timeout-minutes: 5
      - name: Discover exact coverage and build the ordinary artifact once
        id: prepare
        run: timeout --signal=TERM --kill-after=15s 15m npm run verify:batches -- prepare verification-receipts/serial/bundle
        timeout-minutes: 16
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue208-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification-receipts/serial/bundle/
          retention-days: 30
          compression-level: 1
          if-no-files-found: warn
      - name: Upload preparation metadata for aggregation
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue208-build-${{ github.run_id }}-${{ github.run_attempt }}-metadata
          path: |
            verification-receipts/serial/bundle/plan.json
            verification-receipts/serial/bundle/build.json
            verification-receipts/serial/bundle/preparation/receipt.json
          retention-days: 30
          if-no-files-found: warn
  batch:
    needs: prepare
    if: always() && !cancelled() && needs.prepare.outputs.matrix != ''
    runs-on: [self-hosted, tactics-browser, "${{ (startsWith(inputs.mode, 'parallel-') || inputs.mode == 'serial-pair') && matrix.runner || inputs.runner || 'tactics-browser-01' }}"]
    concurrency:
      group: ${{ (startsWith(inputs.mode, 'parallel-') || inputs.mode == 'serial-pair') && format('tactics-browser-{0}', matrix.runner) || format('issue208-batch-{0}-{1}', github.run_id, matrix.id) }}
      queue: max
      cancel-in-progress: false
    timeout-minutes: 85
    strategy:
      fail-fast: false
      max-parallel: ${{ startsWith(inputs.mode, 'parallel-') && 2 || 1 }}
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: batch (${{ matrix.id }})
    env:
      SERIAL_BATCH_ID: ${{ matrix.id }}
    steps:
      - name: Record setup start and check host disposition
        run: |
          echo "SERIAL_JOB_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          test ! -f "$RUNNER_TOOL_CACHE/issue208-unsafe-host"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ (inputs.mode == 'pilot' || (startsWith(inputs.mode, 'parallel-') || inputs.mode == 'serial-pair')) && env.PILOT_NODE_VERSION || '24' }}
          cache: npm
      - run: npm ci
        timeout-minutes: 10
      - run: npm run setup:browsers && npm run check:browsers
        timeout-minutes: 5
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.bundle }}
          path: verification-receipts/serial/bundle/
      - name: Verify parallel pilot inputs and sample the runner clock
        if: startsWith(inputs.mode, 'parallel-')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm run verify:batches -- ready verification-receipts/serial/bundle \
            "$SERIAL_BATCH_ID" "verification-receipts/serial/jobs/$SERIAL_BATCH_ID"
        timeout-minutes: 5
      - uses: actions/upload-artifact@v4
        if: startsWith(inputs.mode, 'parallel-')
        with:
          name: issue208-ready-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}
          path: verification-receipts/serial/jobs/${{ matrix.id }}/ready.json
          retention-days: 30
          if-no-files-found: error
      - name: Wait for both parallel pilot runners
        if: startsWith(inputs.mode, 'parallel-')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run verify:batches -- await-pilot
        timeout-minutes: 5
      - name: Verify and execute this batch with its independent budget
        env:
          GITHUB_TOKEN: ${{ startsWith(inputs.mode, 'parallel-') && github.token || '' }}
        run: |
          timeout --signal=TERM --kill-after=15s 65m npm run verify:batches -- run \
            verification-receipts/serial/bundle "$SERIAL_BATCH_ID" "verification-receipts/serial/jobs/$SERIAL_BATCH_ID"
        timeout-minutes: 66
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue208-receipts-${{ github.run_id }}-${{ matrix.id }}-${{ github.run_attempt }}
          path: verification-receipts/serial/jobs/${{ matrix.id }}/
          retention-days: 30
          compression-level: 1
          if-no-files-found: warn
  aggregate:
    name: Serial verification aggregate
    needs: [prepare, batch]
    if: always() && github.event_name == 'workflow_dispatch' && github.repository == 'luminari-gurus/tactics-guru-v2' && inputs.mode != 'qualify' && inputs.extra_job != 'full-verify' && (github.ref == 'refs/heads/main' || (endsWith(inputs.mode, '-pair') && github.ref == 'refs/heads/work/issue-208-matched-pair') || github.ref == 'refs/heads/work/issue-208-serial-batches' || ((inputs.mode == 'pilot' || inputs.mode == 'parallel-pilot') && github.ref == 'refs/heads/work/issue-208-parallel-pilot'))
    runs-on: [self-hosted, tactics-browser, "${{ (startsWith(inputs.mode, 'parallel-') || inputs.mode == 'serial-pair') && 'tactics-browser-01' || inputs.runner || 'tactics-browser-01' }}"]
    concurrency:
      group: ${{ (startsWith(inputs.mode, 'parallel-') || inputs.mode == 'serial-pair') && format('tactics-browser-{0}', 'tactics-browser-01') || format('issue208-aggregate-{0}', github.run_id) }}
      queue: max
      cancel-in-progress: false
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ (inputs.mode == 'pilot' || (startsWith(inputs.mode, 'parallel-') || inputs.mode == 'serial-pair')) && env.PILOT_NODE_VERSION || '24' }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.bundle }}-metadata
          path: verification-receipts/serial/bundle/
      - uses: actions/download-artifact@v4
        with:
          pattern: issue208-receipts-${{ github.run_id }}-*
          path: verification-receipts/serial/downloads/
      - name: Account for every expected batch, all attempts and scheduler overhead
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verification-batches.mjs aggregate verification-receipts/serial/bundle verification-receipts/serial/downloads verification-receipts/serial/aggregate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue208-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification-receipts/serial/aggregate/
          retention-days: 30
          if-no-files-found: warn

  full-verify:
    if: github.repository == 'luminari-gurus/tactics-guru-v2' && (github.event_name == 'push' || inputs.extra_job == 'full-verify')
    runs-on: [self-hosted, tactics-browser, "${{ inputs.runner || 'tactics-browser-01' }}"]
    timeout-minutes: 420
    # Push and extra_job=full-verify do not set inputs.mode=capture; discover requires it.
    env:
      SERIAL_MODE: capture
    steps:
      - name: Check host disposition
        run: test ! -f "$RUNNER_TOOL_CACHE/issue208-unsafe-host"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        timeout-minutes: 10
      - run: npm run setup:browsers && npm run check:browsers
        timeout-minutes: 10
      - name: Record source and complete discovery
        run: |
          mkdir -p verification-receipts/full-verify
          git rev-parse HEAD > verification-receipts/full-verify/source.txt
          node scripts/verification-selection.mjs capture verification-receipts/full-verify/selection.json
          npm run verify:batches -- discover verification-receipts/serial/full-verify-discovery
      - name: Execute full regression with original limits
        run: npm run verify:full
        timeout-minutes: 390
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-verify-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            verification-receipts/
            tmp/verification/
          retention-days: 30
          if-no-files-found: warn

