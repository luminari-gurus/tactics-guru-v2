name: Issue 200 initial-readiness comparison
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tactics-browser-exclusive
  cancel-in-progress: false
jobs:
  readiness:
    if: github.repository == 'luminari-gurus/tactics-guru-v2' && github.ref == 'refs/heads/work/issue-200-initial-readiness'
    runs-on: [self-hosted, tactics-browser]
    timeout-minutes: 15
    steps:
      - run: test ! -f "$RUNNER_TOOL_CACHE/issue208-unsafe-host"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run setup:browsers && npm run check:browsers
      - run: npm run build
      - name: Verify ordinary first-tone coverage on all Chromium profiles
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: verification-receipts/readiness/ordinary.json
        run: |
          mkdir -p verification-receipts/readiness
          npx --no-install playwright test tests/audio.spec.ts -g 'the test tone plays only' --workers=1 --retries=0 --trace=off --reporter=list,json --output=verification-receipts/readiness/ordinary-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue200-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification-receipts/readiness/
          retention-days: 30
