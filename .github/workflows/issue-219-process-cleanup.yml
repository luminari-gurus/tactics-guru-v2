name: Issue 219 process cleanup qualification
on:
  pull_request:
    branches: [work/issue-200-verification-timings]
    types: [opened, synchronize, reopened]
    paths:
      - scripts/verification-*.mjs
      - tests/tooling/verification-*.test.mjs
      - .github/workflows/issue-219-process-cleanup.yml
      - package.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tactics-issue219-qualification
  cancel-in-progress: true
jobs:
  qualify:
    if: github.repository == 'luminari-gurus/tactics-guru-v2' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'work/issue-219-owned-process-cleanup') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/work/issue-219-owned-process-cleanup'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      # This qualification never invokes the release CLI. Avoid its unrelated
      # binary postinstall and registry audit requests; keep lockfile resolution.
      - run: npm ci --ignore-scripts --no-audit --no-fund
        timeout-minutes: 3
      - run: npx --no-install playwright install --with-deps chromium
        timeout-minutes: 3
      - run: npm run test:verification-tooling && npm run test:verification
      - run: npm run build
      - run: node --test tests/tooling/verification-browser.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue219-owned-process-qualification
          path: verification-receipts/issue219/
          retention-days: 30
