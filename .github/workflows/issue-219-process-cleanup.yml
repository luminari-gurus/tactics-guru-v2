name: Issue 219 process cleanup qualification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tactics-browser-exclusive
  cancel-in-progress: false
jobs:
  qualify:
    if: github.repository == 'luminari-gurus/tactics-guru-v2' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/work/issue-200-verification-timings')
    runs-on: [self-hosted, tactics-browser]
    timeout-minutes: 15
    steps:
      - name: Check host disposition before cleanup qualification
        run: test ! -f "$RUNNER_TOOL_CACHE/issue208-unsafe-host"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      # This qualification never invokes the release CLI. Avoid its unrelated
      # binary postinstall and registry audit requests; keep lockfile resolution.
      - run: npm ci --ignore-scripts --no-audit --no-fund
        timeout-minutes: 3
      - run: npx --no-install playwright install chromium
        timeout-minutes: 3
      - run: npm run test:verification-tooling && npm run test:verification
      - run: npm run build
      - run: node --test tests/tooling/verification-browser.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue219-owned-process-qualification
          path: verification-receipts/issue219/
          retention-days: 30
