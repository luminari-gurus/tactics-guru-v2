name: Issue 257 Chromium startup attribution
on:
  push:
    branches: [work/issue-257-startup-attribution]
    paths: ['.github/workflows/issue-257-startup-attribution.yml']
permissions:
  contents: read
concurrency:
  group: tactics-browser-tactics-browser-01
  queue: max
  cancel-in-progress: false
jobs:
  capture:
    if: github.repository == 'luminari-gurus/tactics-guru-v2' && github.ref == 'refs/heads/work/issue-257-startup-attribution'
    runs-on: [self-hosted, tactics-browser, tactics-browser-01]
    name: Replay landscape batch ${{ matrix.batch }} through its witness
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        batch: [1, 2]
    env:
      ISSUE_257_STARTUP_CAPTURE: '1'
      PLAYWRIGHT_SERVER_MODE: preview
      PLAYWRIGHT_BASE_PATH: /
    defaults:
      run:
        working-directory: historical
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check host disposition
        run: test ! -f "$RUNNER_TOOL_CACHE/issue208-unsafe-host"
        working-directory: .
      - uses: actions/checkout@v4
        with:
          ref: 66986091d9ec2fba884eb4ec51b6c5813f4e6602
          path: historical
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: historical/package-lock.json
      - run: npm ci
      - run: npm run setup:browsers -- --no-remove && npm run check:browsers
      - name: Record clean historical source and build preview
        run: |
          out=verification-receipts/issue-257
          mkdir -p "$out"
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          import os from 'node:os';
          import { sourceIdentity } from './scripts/verification-report.mjs';
          const source = sourceIdentity(process.cwd());
          if (source.dirty) throw Error('Expected a clean historical checkout before building');
          writeFileSync('verification-receipts/issue-257/source.json', JSON.stringify({
            source, captureCommit: process.env.GITHUB_SHA, node: process.version,
            runner: process.env.RUNNER_NAME, cpuCount: os.availableParallelism(), loadAverage: os.loadavg(),
          }, null, 2));
          JS
          npm run build
          find dist -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum > "$out/dist.sha256"
      - name: Add failure diagnostics to the historical witnesses
        run: |
          git apply --unidiff-zero ../tests/issue-257-replay/witnesses.patch
          cp ../tests/helpers/startupObserver.ts tests/helpers/
          # The historical witnesses use the plain fixture. The newer dungeon fixtures are absent here.
          sed -e '/^import { test as dungeon,/d' \
              -e '/^export const test = dungeon\./d' \
              -e '/^export const railTest = dungeonRail\./d' \
              ../tests/helpers/startupDiagnostics.ts > tests/helpers/startupDiagnostics.ts
      - name: Replay historical order and retain failures
        env:
          LANDSCAPE_BATCH: ${{ matrix.batch }}
        run: |
          out="$PWD/verification-receipts/issue-257"
          list="../tests/issue-257-replay/landscape-$LANDSCAPE_BATCH.txt"
          cp "$list" "$out/expected-order.txt"
          # Record load at the boundary corresponding to the original batch receipts.
          node -e 'console.log(JSON.stringify(require("node:os").loadavg()))' > "$out/start-load.json"
          export VERIFICATION_PLAYWRIGHT_EVENTS="$out/cases.jsonl"
          export PLAYWRIGHT_JSON_OUTPUT_FILE="$out/results.json"
          status=0
          timeout --signal=TERM --kill-after=15s 27m node_modules/.bin/playwright test \
            --project=mobile-landscape --workers=1 --retries=0 --test-list "$list" \
            --trace retain-on-failure --output "$out/artifacts" \
            --reporter=line,json,./scripts/verification-playwright-reporter.mjs || status=$?
          node --input-type=module - "$out" <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const out = process.argv[2];
          const lines = path => readFileSync(path, 'utf8').trimEnd().split('\n');
          const expected = lines(out + '/expected-order.txt');
          const actual = lines(out + '/cases.jsonl').map(line => JSON.parse(line))
            .filter(event => event.event === 'testBegin')
            .map(event => [event.file.split('/tests/').at(-1), ...event.title.split(' > ').slice(3)].join(' › '));
          assert.deepEqual(actual, expected, 'Observed Playwright start order differs from the original batch');
          console.log('Verified original start order for %d cases', actual.length);
          JS
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-257-landscape-${{ matrix.batch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            historical/verification-receipts/issue-257/
            historical/verification-receipts/browser-environment/
          retention-days: 14
