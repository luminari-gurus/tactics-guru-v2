name: PR verification
on:
  pull_request:
  workflow_dispatch:
    inputs:
      cold_setup:
        description: Use empty job-local npm and Playwright caches
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  supersede:
    # This job only reads PR metadata and cancels obsolete verification runs.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
      pull-requests: read
    outputs:
      current: ${{ steps.cancel.outputs.current }}
    steps:
      - name: Cancel verification for superseded PR commits
        id: cancel
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const pullRequest = { ...context.repo, pull_number: pr.number };
            const isCurrent = async () => {
              const { data } = await github.rest.pulls.get(pullRequest);
              return data.state === 'open' && data.head.sha === pr.head.sha;
            };
            if (!await isCurrent()) return;

            const active = ['requested', 'queued', 'pending', 'waiting', 'in_progress'];
            const pages = await Promise.all(active.map(status => github.paginate(
              github.rest.actions.listWorkflowRuns,
              { ...context.repo, workflow_id: 'pr-verification.yml', event: 'pull_request',
                branch: pr.head.ref, status, per_page: 100 }
            )));
            const seen = new Set();
            for (const run of pages.flat()) {
              if (seen.has(run.id) || run.id === context.runId || run.head_sha === pr.head.sha ||
                  run.head_repository?.id !== pr.head.repo.id ||
                  !run.pull_requests?.some(candidate => candidate.id === pr.id)) continue;
              seen.add(run.id);
              if (!await isCurrent()) return;
              try {
                await github.rest.actions.cancelWorkflowRun({ ...context.repo, run_id: run.id });
              } catch (error) {
                // The run may have completed or begun cancellation after listing.
                if (error.status !== 409) throw error;
              }
            }
            core.setOutput('current', await isCurrent());
  verify:
    needs: supersede
    # Never execute untrusted fork code on a persistent self-hosted machine.
    if: >-
      !cancelled() && (github.event_name == 'workflow_dispatch' ||
        (github.event.pull_request.head.repo.full_name == github.repository &&
         needs.supersede.outputs.current == 'true'))
    permissions:
      contents: read
      pull-requests: read
    runs-on: [self-hosted, tactics-browser, tactics-browser-01]
    timeout-minutes: 10
    concurrency:
      # Share VM 01 with manual browser workflows without cancelling them.
      group: tactics-browser-tactics-browser-01
      queue: max
      cancel-in-progress: false
    steps:
      # A job-only rerun can reuse a successful supersede result from its original attempt.
      - name: Check that the PR commit is still current
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { data } = await github.rest.pulls.get({ ...context.repo, pull_number: pr.number });
            if (data.state !== 'open' || data.head.sha !== pr.head.sha) {
              core.setFailed('This PR commit has been superseded.');
            }
      - name: Check host disposition
        run: test ! -f "$RUNNER_TOOL_CACHE/issue208-unsafe-host"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Isolate cold dependency and browser setup
        if: github.event_name == 'workflow_dispatch' && inputs.cold_setup
        run: |
          test -z "${PLAYWRIGHT_CHROMIUM_EXECUTABLE:-}"
          cache_root="$(mktemp -d "${RUNNER_TEMP}/pr-cold-setup.XXXXXX")"
          mkdir "$cache_root/npm" "$cache_root/browsers"
          printf 'npm_config_cache=%s/npm\nPLAYWRIGHT_BROWSERS_PATH=%s/browsers\n' \
            "$cache_root" "$cache_root" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: ${{ inputs.cold_setup != true && 'npm' || '' }}
      - run: node --test tests/tooling/risk-gate.test.mjs
      - run: npm ci
      - run: npm run setup:browsers
      - run: npm run verify:pr
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification-receipts/pr/
          retention-days: 14
          if-no-files-found: warn
