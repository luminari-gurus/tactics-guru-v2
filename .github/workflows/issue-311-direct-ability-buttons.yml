name: Issue 311 direct ability buttons
on:
  push:
    branches: [work/issue-311-direct-ability-buttons]
    paths: ['src/**', 'tests/**', 'scripts/**', '*config*', 'package*.json', '.github/workflows/issue-311-direct-ability-buttons.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tactics-browser-tactics-browser-02
  queue: max
  cancel-in-progress: false
jobs:
  abilities:
    if: github.repository == 'luminari-gurus/tactics-guru-v2' && github.ref == 'refs/heads/work/issue-311-direct-ability-buttons'
    runs-on: [self-hosted, tactics-browser, tactics-browser-02]
    timeout-minutes: 40
    steps:
      - name: Check host disposition
        run: test ! -f "$RUNNER_TOOL_CACHE/issue208-unsafe-host"
      - name: Check out exact comparison base
        uses: actions/checkout@v4
        with:
          ref: dafdeb3f38e7d5be9d73b91101cf020fb2e5401d
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run setup:browsers && npm run check:browsers
      - name: Record exact base and WebKit profile
        run: |
          mkdir -p tmp verification-receipts/issue-311
          cat > tmp/issue-311-abilities-webkit.config.ts <<'TS'
          import { devices } from '@playwright/test';
          import base from '../playwright.fixtures.config';
          export default { ...base, testDir: '../tests', testMatch: '**/ability-picker.spec.ts',
            webServer: { ...base.webServer, cwd: process.cwd() },
            projects: [
              { name: 'abilities-webkit-portrait', use: { ...devices['iPhone 13'], screen: undefined, launchOptions: {} } },
              { name: 'abilities-webkit-landscape', use: { ...devices['iPhone 13 landscape'], screen: undefined, launchOptions: {} } },
            ],
          };
          TS
          cp tmp/issue-311-abilities-webkit.config.ts verification-receipts/issue-311/
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          import { sourceIdentity } from './scripts/verification-report.mjs';
          writeFileSync('verification-receipts/issue-311/base-source.json', JSON.stringify({
            source: sourceIdentity(process.cwd()), node: process.version, runner: process.env.RUNNER_NAME,
            purpose: 'Exact-base diagnostic; a failure is retained and is not passing head evidence'
          }, null, 2));
          JS
      - name: Diagnose held radial reviews on exact base
        id: baseline
        continue-on-error: true
        run: |
          selection=(-c tmp/issue-311-abilities-webkit.config.ts -g 'review356 held radial aim keeps the full review aligned with release|review356 friendly radial hold requires review before damage')
          npx --no-install playwright test "${selection[@]}" --list | tee verification-receipts/issue-311/base-selection.txt
          npm run test:browser -- "${selection[@]}" --diagnostics
      - name: Preserve baseline outcome separately
        if: always()
        run: |
          mkdir -p verification-receipts/issue-311
          printf '%s\n' '${{ steps.baseline.outcome }}' > verification-receipts/issue-311/base-outcome.txt
          if [ -d verification-receipts/browser-runs ]; then
            mv verification-receipts/browser-runs verification-receipts/issue-311/base-browser-runs
          fi
      - name: Upload exact-base diagnostic immediately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-311-base-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification-receipts/issue-311/
          retention-days: 14
          if-no-files-found: warn
      - name: Restore exact implementation head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: false
          fetch-depth: 0
          persist-credentials: false
      - run: npm ci
      - name: Record implementation source identity
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          import { sourceIdentity } from './scripts/verification-report.mjs';
          writeFileSync('verification-receipts/issue-311/source.json', JSON.stringify({
            source: sourceIdentity(process.cwd()), node: process.version, runner: process.env.RUNNER_NAME,
            conditions: 'Qualified persistent runner; browser/device emulation; shared host load and caches not independently controlled',
            priorRun: '42891748707: 194 passed / 4 failed; original receipts remain immutable',
            reuse: 'Run 42891748707 retains 56 passing control-stage cases and their layout screenshots. HUD, styles, and those test bodies are unchanged; the new scene change only retains caption height during held radial gestures. Requalify native tap, held review, radial gestures, resize cancellation, and camera paths here.'
          }, null, 2));
          JS
      - name: Build the implementation
        id: build
        run: npm run build
      - name: Verify native WebKit tap and held review paths
        id: native
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          selection=(-c tmp/issue-311-abilities-webkit.config.ts -g 'direct ability controls stay hidden across radial turns and restore with the rail|radial Special does not commit when choices appear on a narrow screen|review356 held radial aim keeps the full review aligned with release|review356 friendly radial hold requires review before damage')
          npx --no-install playwright test "${selection[@]}" --list | tee verification-receipts/issue-311/native-repair-selection.txt
          npm run test:browser -- "${selection[@]}" --diagnostics
      - name: Upload native repair evidence immediately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-311-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification-receipts/
          retention-days: 14
          if-no-files-found: warn
      - name: Qualify Chromium radial review and gestures
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        run: |
          selection=(-c playwright.fixtures.config.ts tests/ability-picker.spec.ts -g 'review356|keyboard-only shortcuts (use canonical radial|keep radial S)|radial (multiple specials|Frost Snare|hold keeps|shifted hold|compact landscape)')
          npx --no-install playwright test "${selection[@]}" --list | tee verification-receipts/issue-311/chromium-review-selection.txt
          npm run test:browser -- "${selection[@]}" --diagnostics
      - name: Qualify WebKit radial review and gestures
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        run: |
          selection=(-c tmp/issue-311-abilities-webkit.config.ts -g 'review356|keyboard-only shortcuts (use canonical radial|keep radial S)|radial (multiple specials|Frost Snare|hold keeps|shifted hold|compact landscape)')
          npx --no-install playwright test "${selection[@]}" --list | tee verification-receipts/issue-311/webkit-review-selection.txt
          npm run test:browser -- "${selection[@]}" --diagnostics
      - name: Preserve production Chromium radial and camera behavior
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        run: |
          selection=(-c playwright.regression.config.ts tests/battle-radial.spec.ts tests/battle-board.spec.ts -g 'radial hold opens labelled slices on a reachable tile|radial tap fallback opens the same radial without requiring a hold|radial hub cancel records no command after leaving a slice|radial special commits the only legal special without a sub-ring|radial special tap waits for a sub-ring choice after hovering|radial invalid reselection clears the previous command before switching to rail|radial switching to rail preserves a valid unchanged selection|radial preference replaces the side rail with a bottom dock at 1280x720|temporary HUD expansion does not leave the battle camera zoomed|viewport resize recenters a camera capped by temporary HUD reflow|radial resize cancels a held gesture and ignores the trailing release|radial stays open on a layout reflow without a viewport resize|radial resize dismisses an open tap menu without committing or stranding it')
          npx --no-install playwright test "${selection[@]}" --list | tee verification-receipts/issue-311/chromium-radial-selection.txt
          npm run test:browser -- "${selection[@]}" --diagnostics
      - name: Preserve production WebKit radial and camera behavior
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        run: |
          selection=(-c playwright.device-acceptance.config.ts tests/battle-radial.spec.ts tests/battle-board.spec.ts -g 'radial hold opens labelled slices on a reachable tile|radial tap fallback opens the same radial without requiring a hold|radial hub cancel records no command after leaving a slice|radial special tap waits for a sub-ring choice after hovering|radial switching to rail preserves a valid unchanged selection|temporary HUD expansion does not leave the battle camera zoomed|viewport resize recenters a camera capped by temporary HUD reflow|radial resize cancels a held gesture and ignores the trailing release|radial stays open on a layout reflow without a viewport resize|radial resize dismisses an open tap menu without committing or stranding it')
          npx --no-install playwright test "${selection[@]}" --list | tee verification-receipts/issue-311/webkit-radial-selection.txt
          npm run test:browser -- "${selection[@]}" --diagnostics
      - name: Preserve native touch hold resize cancellation on Chromium
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        run: |
          selection=(-c playwright.regression.config.ts tests/battle-radial.spec.ts --project=mobile-portrait --project=mobile-landscape -g 'radial resize cancels a native touch hold without accepting a command')
          npx --no-install playwright test "${selection[@]}" --list | tee verification-receipts/issue-311/chromium-native-hold-selection.txt
          npm run test:browser -- "${selection[@]}" --diagnostics
      - name: Upload final source-bound acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-311-abilities-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification-receipts/
          retention-days: 14
          if-no-files-found: warn
