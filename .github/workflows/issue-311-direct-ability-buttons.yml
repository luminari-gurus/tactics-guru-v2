name: Issue 311 direct ability buttons
on:
  push:
    branches: [work/issue-311-direct-ability-buttons]
    paths: ['src/**', 'tests/**', 'scripts/**', '*config*', 'package*.json', '.github/workflows/issue-311-direct-ability-buttons.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tactics-browser-tactics-browser-02
  queue: max
  cancel-in-progress: false
jobs:
  abilities:
    if: github.repository == 'luminari-gurus/tactics-guru-v2' && github.ref == 'refs/heads/work/issue-311-direct-ability-buttons'
    runs-on: [self-hosted, tactics-browser, tactics-browser-02]
    timeout-minutes: 40
    steps:
      - name: Check host disposition
        run: test ! -f "$RUNNER_TOOL_CACHE/issue208-unsafe-host"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run setup:browsers && npm run check:browsers
      - name: Record source identity
        run: |
          mkdir -p verification-receipts/issue-311
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          import { sourceIdentity } from './scripts/verification-report.mjs';
          writeFileSync('verification-receipts/issue-311/source.json', JSON.stringify({
            source: sourceIdentity(process.cwd()), node: process.version, runner: process.env.RUNNER_NAME,
            conditions: 'Qualified persistent runner; browser/device emulation; shared host load and caches not independently controlled'
          }, null, 2));
          JS
      - name: Build the application
        id: build
        run: npm run build
      - name: Verify learned ability fixtures on Chromium
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          selection=(-c playwright.fixtures.config.ts tests/ability-picker.spec.ts)
          npx --no-install playwright test "${selection[@]}" --list | tee verification-receipts/issue-311/chromium-fixtures-selection.txt
          npm run test:browser -- "${selection[@]}" --diagnostics
      - name: Verify affected desktop HUD consumers
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          selection=(-c playwright.regression.config.ts tests/battle-loop.spec.ts tests/battle-board.spec.ts tests/battle-animations.spec.ts tests/guarded-effects.spec.ts tests/unit-health-bars.spec.ts tests/dungeon-lifecycle.spec.ts --project=desktop -g 'QA: hover refresh preserves controls and first-click Confirm and Wait|default Move initializes once per usable player turn and preserves explicit choices|keyboard-only movement, attack confirmation and Wait use the shared decision flow|keyboard-only shortcuts yield to editing modifiers composition handled events and dialogs|live actor, inspection and cancellation remain independent of pending intent|accepted rail and dock preserve drawable floors, readable controls and focus at five sizes|occluded archer exposed art selects the same legal target as the dropdown|real controls, travel/impact, transformed anchors and exactly one accepted result|shared Guarded lifecycle and saved feedback: standalone hit|health follows (damage|defeat) presentation, cancellation and save resume|restart during accepted presentation discards old callbacks and history|visibility interruption finishes an accepted terminal presentation exactly once')
          npx --no-install playwright test "${selection[@]}" --list | tee verification-receipts/issue-311/desktop-consumers-selection.txt
          npm run test:browser -- "${selection[@]}" --diagnostics
      - name: Preserve radial touch and HUD reflow boundaries
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          selection=(-c playwright.regression.config.ts tests/battle-radial.spec.ts tests/battle-board.spec.ts -g 'radial hold opens labelled slices on a reachable tile|radial tap fallback opens the same radial without requiring a hold|radial hub cancel records no command after leaving a slice|radial special commits the only legal special without a sub-ring|radial special tap waits for a sub-ring choice after hovering|radial invalid reselection clears the previous command before switching to rail|radial switching to rail preserves a valid unchanged selection|radial preference replaces the side rail with a bottom dock at 1280x720|temporary HUD expansion does not leave the battle camera zoomed|viewport resize recenters a camera capped by temporary HUD reflow')
          npx --no-install playwright test "${selection[@]}" --list | tee verification-receipts/issue-311/chromium-radial-selection.txt
          npm run test:browser -- "${selection[@]}" --diagnostics
      - name: Verify named abilities on WebKit touch profiles
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          mkdir -p tmp
          cat > tmp/issue-311-abilities-webkit.config.ts <<'TS'
          import { devices } from '@playwright/test';
          import base from '../playwright.fixtures.config';
          export default { ...base, testDir: '../tests', testMatch: '**/ability-picker.spec.ts',
            webServer: { ...base.webServer, cwd: process.cwd() },
            projects: [
              { name: 'abilities-webkit-portrait', use: { ...devices['iPhone 13'], screen: undefined, launchOptions: {} } },
              { name: 'abilities-webkit-landscape', use: { ...devices['iPhone 13 landscape'], screen: undefined, launchOptions: {} } },
            ],
          };
          TS
          cp tmp/issue-311-abilities-webkit.config.ts verification-receipts/issue-311/
          selection=(-c tmp/issue-311-abilities-webkit.config.ts -g 'direct ability|keyboard-only shortcuts select (fighter|ranger|mage) learned abilities and preserve resource locks|Ranger mark_target preserves keyboard touch preview cancellation inspection and fresh reload|Fighter healing and Taunt preserve keyboard touch cancellation inspection and fresh reload|radial multiple specials remain reachable on a narrow viewport|radial Special does not commit when choices appear on a narrow screen|radial compact landscape keeps Special choices reachable')
          npx --no-install playwright test "${selection[@]}" --list | tee verification-receipts/issue-311/webkit-fixtures-selection.txt
          npm run test:browser -- "${selection[@]}" --diagnostics
      - name: Preserve production WebKit radial and camera behavior
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          selection=(-c playwright.device-acceptance.config.ts tests/battle-radial.spec.ts tests/battle-board.spec.ts -g 'radial hold opens labelled slices on a reachable tile|radial tap fallback opens the same radial without requiring a hold|radial hub cancel records no command after leaving a slice|radial special tap waits for a sub-ring choice after hovering|radial switching to rail preserves a valid unchanged selection|temporary HUD expansion does not leave the battle camera zoomed|viewport resize recenters a camera capped by temporary HUD reflow')
          npx --no-install playwright test "${selection[@]}" --list | tee verification-receipts/issue-311/webkit-radial-selection.txt
          npm run test:browser -- "${selection[@]}" --diagnostics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-311-abilities-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification-receipts/
          retention-days: 14
          if-no-files-found: warn
