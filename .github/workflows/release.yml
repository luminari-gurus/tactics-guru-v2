name: Tested static release
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tg-beta-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Restricted publisher security tests
        run: python3 -m unittest discover -s deploy -v
      - name: Real isolated OpenSSH security tests
        run: |
          docker build -f deploy/Dockerfile.ssh-test -t tg-ssh-test .
          docker run --rm --network none --security-opt no-new-privileges tg-ssh-test
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Verify current main and publish via restricted SSH
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
          TG_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.TG_DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          set -eu
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$latest" != "$GITHUB_SHA" ]; then
            printf '%s\n' 'Superseded main build: not deployed'
            exit 0
          fi
          python3 deploy/ssh_upload.py
