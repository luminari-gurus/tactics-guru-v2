name: Verify party acceptance waits and literal base
on:
  push:
    branches: [verify/issue-415-map-edge-controls]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tactics-browser-tactics-browser-02
  queue: max
  cancel-in-progress: false
jobs:
  movement:
    if: github.repository == 'luminari-gurus/tactics-guru-v2' && github.ref == 'refs/heads/verify/issue-415-map-edge-controls'
    runs-on: [self-hosted, tactics-browser, tactics-browser-02]
    timeout-minutes: 20
    steps:
      - name: Check host disposition
        run: test ! -f "$RUNNER_TOOL_CACHE/issue208-unsafe-host"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run setup:browsers && npm run check:browsers
      - name: Fetch implementation and literal base
        run: git fetch origin 8c1eb585facc190ce7de74e7a773859611b91f3d 65211c809e86ecab223c9ae1afef8576aad3179b
      - name: Check original witnesses on the literal base
        id: base
        run: |
          git checkout --detach 65211c809e86ecab223c9ae1afef8576aad3179b
          npm run build:bundle
          mkdir -p verification-receipts/issue-415
          node --input-type=module -e "import { writeFileSync } from 'node:fs'; import { sourceIdentity } from './scripts/verification-report.mjs'; writeFileSync('verification-receipts/issue-415/literal-base-source.json',JSON.stringify({source:sourceIdentity(process.cwd()),node:process.version,runner:process.env.RUNNER_NAME},null,2));"
          npm run test:browser -- -c playwright.regression.config.ts tests/dungeon.spec.ts -g 'claimed Revive Kit|character sheets switch heroes' --project=desktop --max-failures=2
      - name: Build the final implementation
        id: candidate
        if: ${{ !cancelled() }}
        run: |
          git checkout --detach 8c1eb585facc190ce7de74e7a773859611b91f3d
          npm run build:bundle
          mkdir -p verification-receipts/issue-415
          node --input-type=module -e "import { writeFileSync } from 'node:fs'; import { sourceIdentity } from './scripts/verification-report.mjs'; writeFileSync('verification-receipts/issue-415/final-source.json',JSON.stringify({source:sourceIdentity(process.cwd()),node:process.version,runner:process.env.RUNNER_NAME},null,2));"
      - name: Verify accepted party changes on desktop Chromium
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' }}
        run: npm run test:browser -- -c playwright.regression.config.ts tests/dungeon.spec.ts -g 'claimed Revive Kit|character sheets switch heroes|hero progression commits once' --project=desktop
      - name: Verify accepted party changes on landscape WebKit
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' }}
        run: npm run test:browser -- -c playwright.exploration.config.ts tests/dungeon.spec.ts -g 'claimed Revive Kit|character sheets switch heroes|hero progression commits once' --project=landscape-webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-415-party-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification-receipts/
          retention-days: 14
          if-no-files-found: warn
