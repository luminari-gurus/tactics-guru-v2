name: Issue 310 contact verification
on:
  push:
    branches: [qa/310-dungeon-contact]
permissions:
  contents: read
concurrency:
  group: tactics-browser-tactics-browser-02
  queue: max
  cancel-in-progress: false
jobs:
  contact:
    runs-on: [self-hosted, tactics-browser, tactics-browser-02]
    timeout-minutes: 25
    steps:
      - name: Check host disposition
        run: test ! -f "$RUNNER_TOOL_CACHE/issue208-unsafe-host"
      - uses: actions/checkout@v4
        with:
          ref: c3be6617c787a78ff2f0295a06e9d871ebfc1611
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run setup:browsers
      - name: Record exact source
        run: |
          mkdir -p verification-receipts/issue310
          git rev-parse HEAD > verification-receipts/issue310/source.txt
          node --version >> verification-receipts/issue310/source.txt
          sha256sum package-lock.json >> verification-receipts/issue310/source.txt
      - run: npm run build
      - name: Legal dungeon floor clear, descent and backtrack
        run: npm run test:browser -- -c playwright.regression.config.ts tests/dungeon.spec.ts -g 'testing dungeon legally clears a floor' --project=desktop --diagnostics
      - name: Bounded legal Mage progression and terminal cleanup
        if: success() || failure()
        run: npm run test:browser -- -c playwright.extended.config.ts tests/dungeon-extended.spec.ts -g 'Mage legal progression' --project=desktop --diagnostics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue310-contact-${{ github.run_id }}
          path: |
            verification-receipts/
            test-results/
            test-results-webkit/
          retention-days: 14
          if-no-files-found: warn
