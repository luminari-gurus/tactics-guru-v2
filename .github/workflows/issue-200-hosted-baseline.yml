name: Issue 200 hosted baseline
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: tactics-issue200-baseline
  cancel-in-progress: false
jobs:
  baseline:
    # Explicitly approved interim hosted capacity; only this trusted PR branch.
    if: github.event.pull_request.head.ref == 'work/issue-200-verification-timings' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install lockfile-compatible browsers and OS libraries
        run: npx --no-install playwright install --with-deps chromium webkit
      - name: Verify timing and reporter contracts
        run: npm run test:verification-tooling
      - name: Record hosted environment and start one sequential capture
        id: capture_start
        run: |
          mkdir -p verification-receipts/issue200-ci
          node --input-type=module <<'JS' > verification-receipts/issue200-ci/environment.json
          import os from 'node:os';
          import { readFileSync } from 'node:fs';
          const version = p => JSON.parse(readFileSync(`node_modules/${p}/package.json`, 'utf8')).version;
          console.log(JSON.stringify({ capturedAt: new Date().toISOString(), node: process.version,
            platform: process.platform, arch: process.arch, release: os.release(),
            cpus: os.cpus().length, cpuModel: os.cpus()[0]?.model, memoryBytes: os.totalmem(),
            vite: version('vite'), vitest: version('vitest'), playwright: version('@playwright/test'),
            runnerOS: process.env.RUNNER_OS, runnerArch: process.env.RUNNER_ARCH,
            runId: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            hostClass: 'GitHub-hosted ubuntu-24.04; interim baseline before self-hosted migration' }, null, 2));
          JS
          git rev-parse HEAD > verification-receipts/issue200-ci/source.txt
          cat > "$RUNNER_TEMP/issue200-wait.mjs" <<'JS'
          import { readFileSync, existsSync } from 'node:fs';
          const target = process.argv[2];
          const reportPath = 'verification-receipts/timings/github-hosted-baseline/report.json';
          for (;;) {
            try {
              const report = JSON.parse(readFileSync(reportPath, 'utf8'));
              const stage = report.stages.find(s => s.id === target);
              if (stage) { console.log(JSON.stringify(stage)); break; }
            } catch { /* A checkpoint may be mid-write. */ }
            if (existsSync('verification-receipts/issue200-ci/exit-code.txt')) break;
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          JS
          # One capture owns every stage. Watchers expose progress without rerunning prerequisites.
          # Redirect all descriptors so the capture survives between Actions steps.
          nohup bash -c '
            set +e
            timeout --signal=TERM --kill-after=15s 110m npm run measure:verification -- \
              --out verification-receipts/timings/github-hosted-baseline \
              --conditions "GitHub-hosted Ubuntu 24.04; fresh ephemeral host; locked dependencies and browsers installed; npm download cache may be warm; fresh app build/test caches; reporter qualification and browser preflight before timing; one sequential capture; lightweight 5-second progress watcher; no concurrent browser/performance jobs"
            echo "$?" > verification-receipts/issue200-ci/exit-code.txt
          ' > verification-receipts/issue200-ci/capture.log 2>&1 < /dev/null &
      - name: Capture CPU prerequisites and root build
        run: node "$RUNNER_TEMP/issue200-wait.mjs" build-root
      - name: Capture full Chromium matrix
        run: node "$RUNNER_TEMP/issue200-wait.mjs" chromium
      - name: Capture dev fixtures and WebKit/device coverage
        run: node "$RUNNER_TEMP/issue200-wait.mjs" health-bars
      - name: Capture configured production and development telemetry
        run: node "$RUNNER_TEMP/issue200-wait.mjs" telemetry-development
      - name: Capture root dev assets and isolated performance
        run: node "$RUNNER_TEMP/issue200-wait.mjs" performance
      - name: Capture prefix assets and restore root build
        run: node "$RUNNER_TEMP/issue200-wait.mjs" restore-root
      - name: Require the complete capture result
        if: ${{ !cancelled() && steps.capture_start.outcome == 'success' }}
        run: |
          while [ ! -f verification-receipts/issue200-ci/exit-code.txt ]; do sleep 5; done
          cat verification-receipts/timings/github-hosted-baseline/summary.md >> "$GITHUB_STEP_SUMMARY"
          cat verification-receipts/issue200-ci/capture.log
          exit "$(cat verification-receipts/issue200-ci/exit-code.txt)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-200-hosted-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: verification-receipts/
          retention-days: 30
          compression-level: 1
          if-no-files-found: warn
