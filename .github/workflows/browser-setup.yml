name: Browser setup smoke
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tactics-browser-exclusive
  cancel-in-progress: false
jobs:
  issue184-exact-base:
    if: github.ref == 'refs/heads/work/issue-184-overworld-generation'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fbf82420b82674dc5f57397d68b0a50c8bf485c0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run build
      - name: Record baseline identity
        run: |
          mkdir -p verification-receipts/issue184-base
          git rev-parse HEAD > verification-receipts/issue184-base/source.txt
          uname -a > verification-receipts/issue184-base/host.txt
          npx --no-install playwright --version > verification-receipts/issue184-base/playwright.txt
      - name: Repeat exact-base unsaved-play test
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: verification-receipts/issue184-base/chromium.json
        run: npx --no-install playwright test tests/main-menu.spec.ts --project=mobile-landscape -g 'dungeon departure after rejected movement retains unsaved play warning' --repeat-each=20 --workers=1 --retries=0 --reporter=line,json --output=verification-receipts/issue184-base/artifacts
      - name: Compare exact-base Shaman journey
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: verification-receipts/issue184-base/shaman.json
        run: npx --no-install playwright test tests/dungeon.spec.ts --project=desktop -g 'Shaman production journey uses Hex' --workers=1 --retries=0 --reporter=line,json --output=verification-receipts/issue184-base/shaman-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue184-base-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification-receipts/issue184-base/
          retention-days: 30
          if-no-files-found: warn
  browser-setup:
    if: github.ref != 'refs/heads/work/issue-184-overworld-generation'
    runs-on: [self-hosted, tactics-browser]
    timeout-minutes: 20
    steps:
      - name: Check host disposition before browser setup
        run: test ! -f "$RUNNER_TOOL_CACHE/issue208-unsafe-host"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # OS libraries are provisioned once by the runner administrator.
      - run: npm run setup:browsers
      - run: npm run check:browsers
      - run: node --test tests/tooling/browser-diagnostics.test.mjs
      - run: npm run build
      - run: npm run test:browser-smoke -- --diagnostics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-setup-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            verification-receipts/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
  issue254-verify:
    if: github.ref == 'refs/heads/work/issue-254-dungeon-enemy-behaviors'
    needs: browser-setup
    runs-on: [self-hosted, tactics-browser]
    timeout-minutes: 360
    steps:
      - run: test ! -f "$RUNNER_TOOL_CACHE/issue208-unsafe-host"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run setup:browsers && npm run check:browsers
      - name: Record source and toolchain
        run: |
          mkdir -p verification-receipts/issue254
          git rev-parse HEAD > verification-receipts/issue254/source.txt
          node --version > verification-receipts/issue254/node.txt
          npx --no-install playwright --version > verification-receipts/issue254/playwright.txt
          uname -a > verification-receipts/issue254/host.txt
          git status --short > verification-receipts/issue254/status.txt
          sha256sum package-lock.json src/map/movement.ts src/domain/dungeon.ts tests/unit/overworldMap.test.ts tests/dungeon.spec.ts tests/dungeon-exploration.spec.ts tests/dungeon-lifecycle.spec.ts tests/overworld-map.spec.ts > verification-receipts/issue254/inputs.sha256
          node --input-type=module -e "import {chromium,webkit} from '@playwright/test'; for (const type of [chromium,webkit]) { const browser=await type.launch(); console.log(type.name(),browser.version(),type.executablePath()); await browser.close(); }" > verification-receipts/issue254/browsers.txt
      - run: npm run test:unit
      - run: npm run typecheck
      - id: build
        run: npm run build
      - name: Record served build identity
        if: ${{ steps.build.outcome == 'success' }}
        run: find dist -type f -print0 | sort -z | xargs -0 sha256sum > verification-receipts/issue254/build.sha256
      - name: Chromium exploration including lifecycle and overworld map
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: verification-receipts/issue254/chromium.json
        run: npx --no-install playwright test tests/dungeon-exploration.spec.ts tests/dungeon.spec.ts tests/dungeon-lifecycle.spec.ts tests/overworld-map.spec.ts --workers=1 --retries=0 --reporter=line,json --output=verification-receipts/issue254/chromium-artifacts
      - name: WebKit exploration including lifecycle
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: verification-receipts/issue254/webkit.json
        run: npx --no-install playwright test -c playwright.exploration.config.ts --workers=1 --retries=0 --trace=retain-on-failure --reporter=line,json --output=verification-receipts/issue254/webkit-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue254-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification-receipts/issue254/
          retention-days: 30
          if-no-files-found: warn
  issue184-verify:
    if: github.ref == 'refs/heads/work/issue-184-overworld-generation'
    # Caller-authorized hosted verification for PR #279.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run setup:browsers:linux && npm run check:browsers
      - name: Record source and runtime
        run: |
          mkdir -p verification-receipts/issue184
          git rev-parse HEAD > verification-receipts/issue184/source.txt
          git status --short > verification-receipts/issue184/status.txt
          node --version > verification-receipts/issue184/node.txt
          npx --no-install playwright --version > verification-receipts/issue184/playwright.txt
          uname -a > verification-receipts/issue184/host.txt
          sha256sum package-lock.json src/map/generate.ts src/domain/dungeon.ts src/domain/exploration.ts src/ui/dungeonMap.ts tests/dungeon-exploration.spec.ts > verification-receipts/issue184/inputs.sha256
      - id: build
        run: npm run build
      - name: Record build identity
        if: ${{ steps.build.outcome == 'success' }}
        run: find dist -type f -print0 | sort -z | xargs -0 sha256sum > verification-receipts/issue184/build.sha256
      - name: Affected domain and storage units
        run: npm run test:unit -- tests/unit/dungeon.test.ts tests/unit/exploration.test.ts tests/unit/overworldMap.test.ts tests/unit/dungeonBattle.test.ts
      - name: Dungeon and saved-route Chromium consumers
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: verification-receipts/issue184/chromium-consumers.json
        run: npx --no-install playwright test tests/dungeon-exploration.spec.ts tests/dungeon.spec.ts tests/dungeon-lifecycle.spec.ts tests/main-menu.spec.ts --grep-invert 'maximum-size' --workers=1 --retries=0 --reporter=line,json --output=verification-receipts/issue184/chromium-consumer-artifacts
      - name: Dungeon WebKit exploration consumers
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: verification-receipts/issue184/webkit-consumers.json
        run: npx --no-install playwright test -c playwright.exploration.config.ts --grep-invert 'maximum-size' --workers=1 --retries=0 --reporter=line,json --output=verification-receipts/issue184/webkit-consumer-artifacts
      - name: Maximum-floor Chromium behavior and timing
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: verification-receipts/issue184/chromium.json
        run: npx --no-install playwright test tests/dungeon-exploration.spec.ts -g 'maximum-size' --workers=1 --retries=0 --reporter=line,json --output=verification-receipts/issue184/chromium-artifacts
      - name: Maximum-floor WebKit behavior and timing
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: verification-receipts/issue184/webkit.json
        run: npx --no-install playwright test -c playwright.exploration.config.ts -g 'maximum-size' --workers=1 --retries=0 --reporter=line,json --output=verification-receipts/issue184/webkit-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue184-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification-receipts/issue184/
          retention-days: 30
          if-no-files-found: warn
