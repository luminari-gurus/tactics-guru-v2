name: Browser setup smoke
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/browser-setup.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright*.config.ts'
      - 'scripts/browser-*.mjs'
      - 'tests/boot.spec.ts'
permissions:
  contents: read
jobs:
  browser-setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run setup:browsers:linux
      - run: npm run check:browsers
      - run: npm run build
      - run: npm run test:browser-smoke -- --diagnostics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-setup-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
