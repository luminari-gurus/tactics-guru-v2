name: Issue 160 progression qualification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tactics-browser-exclusive
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'luminari-gurus/tactics-guru-v2' && github.ref == 'refs/heads/work/issue-160-hero-progression'
    runs-on: [self-hosted, tactics-browser]
    timeout-minutes: 85
    steps:
      - run: test ! -f "$RUNNER_TOOL_CACHE/issue208-unsafe-host"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run setup:browsers && npm run check:browsers
      - name: Final source and focused domain qualification
        run: |
          mkdir -p tmp/issue160-ci
          git rev-parse HEAD > tmp/issue160-ci/source.txt
          node --version > tmp/issue160-ci/node.txt
          npx vitest run tests/unit/progression.test.ts tests/unit/dungeon.test.ts tests/unit/dungeonBattle.test.ts tests/unit/exploration.test.ts tests/unit/abilityValidation.test.ts tests/unit/authoredEncounters.test.ts --maxWorkers=1 > tmp/issue160-ci/unit.txt 2>&1
          npm run build > tmp/issue160-ci/build.txt 2>&1
      - name: Final Chromium progression boundary
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: tmp/issue160-ci/chromium.json
        run: npx playwright test tests/dungeon.spec.ts --grep 'hero progression' --reporter=line,json --output=tmp/issue160-ci/chromium-artifacts > tmp/issue160-ci/chromium.txt 2>&1
      - name: Final WebKit progression boundary
        if: always()
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: tmp/issue160-ci/webkit.json
        run: npx playwright test -c playwright.exploration.config.ts tests/dungeon.spec.ts tests/dungeon-exploration.spec.ts --grep 'hero progression|pre-progression dungeon remains incompatible|cold progression-format' --reporter=line,json --output=tmp/issue160-ci/webkit-artifacts > tmp/issue160-ci/webkit.txt 2>&1
      - name: Remaining WebKit run persistence consumers
        if: always()
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: tmp/issue160-ci/webkit-run.json
        run: |
          npx playwright test -c playwright.device-acceptance.config.ts tests/run-progression.spec.ts --grep 'accepted player presentation reload|run preparation and dialogs|review: read-level' --reporter=line,json --output=tmp/issue160-ci/webkit-run-artifacts > tmp/issue160-ci/webkit-run.txt 2>&1
      - name: Final learned ability and caster restoration fixtures
        if: always()
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: tmp/issue160-ci/fixtures.json
        run: npm run test:fixtures -- --grep 'progression XP' --reporter=line,json --output=tmp/issue160-ci/fixture-artifacts > tmp/issue160-ci/fixtures.txt 2>&1
      - name: Engine smoke
        if: always()
        run: npm run test:browser-smoke > tmp/issue160-ci/engine.txt 2>&1
      - name: Run telemetry boundary with separate configured build
        if: always()
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: tmp/issue160-ci/telemetry.json
        run: npm run test:telemetry -- --project=desktop --grep 'mocked ingestion sees accepted run' --reporter=line,json --output=tmp/issue160-ci/telemetry-artifacts > tmp/issue160-ci/telemetry.txt 2>&1
      - name: Retain environment and exact source/build manifests
        if: always()
        run: |
          if test -d verification-receipts; then cp -R verification-receipts tmp/issue160-ci/browser-receipts; fi
          node --input-type=module <<'JS' > tmp/issue160-ci/inputs.json
          import fs from 'node:fs';
          import os from 'node:os';
          import crypto from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          const files=execFileSync('git',['ls-files','-z','--','src','tests','package.json','package-lock.json','*config*.ts'],{encoding:'utf8'}).split(String.fromCharCode(0)).filter(Boolean);
          const hash=p=>crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const tree=root=>fs.existsSync(root)?Object.fromEntries(fs.readdirSync(root,{recursive:true}).map(p=>root+'/'+p).filter(p=>fs.statSync(p).isFile()).sort().map(p=>[p,hash(p)])):{};
          console.log(JSON.stringify({source:execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),node:process.version,platform:process.platform,arch:process.arch,release:os.release(),cpuCount:os.cpus().length,files:Object.fromEntries(files.map(p=>[p,hash(p)])),ordinaryBuild:tree('dist'),telemetryBuild:tree('tmp/issue128-dist')},null,2));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue160-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/issue160-ci/
          retention-days: 30
          if-no-files-found: warn
