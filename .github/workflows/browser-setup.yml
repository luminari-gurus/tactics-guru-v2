name: Issue 254 WebKit startup investigation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tactics-browser-exclusive
  cancel-in-progress: false
jobs:
  compare:
    runs-on: [self-hosted, tactics-browser]
    timeout-minutes: 100
    steps:
      - run: test ! -f "$RUNNER_TOOL_CACHE/issue208-unsafe-host"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run setup:browsers && npm run check:browsers
      - name: Record input identity
        run: |
          mkdir -p verification-receipts/compass
          git rev-parse HEAD > verification-receipts/compass/source.txt
          git status --short > verification-receipts/compass/status.txt
          node --version > verification-receipts/compass/node.txt
          npx --no-install playwright --version > verification-receipts/compass/playwright.txt
          uname -a > verification-receipts/compass/host.txt
          sha256sum package-lock.json playwright.config.ts playwright.exploration.config.ts tests/dungeon-exploration.spec.ts tests/helpers/dungeonTraversal.ts src/main.ts > verification-receipts/compass/inputs.sha256
      - id: build
        run: npm run build
      - name: Record build identity
        if: ${{ steps.build.outcome == 'success' }}
        run: find dist -type f -print0 | sort -z | xargs -0 sha256sum > verification-receipts/compass/build.sha256
      - name: Repeat full WebKit exploration with failure diagnostics
        if: ${{ steps.build.outcome == 'success' }}
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: verification-receipts/compass/results.json
        run: npx --no-install playwright test -c playwright.exploration.config.ts --workers=1 --retries=0 --trace=retain-on-failure --reporter=line,json --output=verification-receipts/compass/artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumented-exploration-${{ github.run_id }}
          path: verification-receipts/compass/
          retention-days: 30
          if-no-files-found: warn
