name: Issue 160 progression qualification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tactics-browser-exclusive
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'luminari-gurus/tactics-guru-v2' && github.ref == 'refs/heads/work/issue-160-hero-progression'
    runs-on: [self-hosted, tactics-browser]
    timeout-minutes: 85
    steps:
      - run: test ! -f "$RUNNER_TOOL_CACHE/issue208-unsafe-host"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run setup:browsers && npm run check:browsers
      - name: Source and build qualification
        run: |
          mkdir -p tmp/issue160-ci
          git rev-parse HEAD > tmp/issue160-ci/source.txt
          node --version > tmp/issue160-ci/node.txt
          npm run test:unit -- --maxWorkers=1 --reporter=verbose > tmp/issue160-ci/unit.log 2>&1
          npm run build > tmp/issue160-ci/build.log 2>&1
      - name: Discover affected modes
        if: always()
        run: |
          npx playwright test tests/dungeon.spec.ts tests/dungeon-exploration.spec.ts tests/dungeon-lifecycle.spec.ts tests/run-progression.spec.ts --list --reporter=json > tmp/issue160-ci/selection.json
          npx playwright test -c playwright.fixtures.config.ts --list --reporter=json > tmp/issue160-ci/fixtures-selection.json
      - name: Chromium affected consumers
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: tmp/issue160-ci/chromium.json
        run: npx playwright test tests/dungeon.spec.ts tests/dungeon-exploration.spec.ts tests/dungeon-lifecycle.spec.ts tests/run-progression.spec.ts --reporter=line,json --output=tmp/issue160-ci/chromium-artifacts > tmp/issue160-ci/chromium.log 2>&1
      - name: Fixture consumers
        if: always()
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: tmp/issue160-ci/fixtures.json
        run: npm run test:fixtures -- --reporter=line,json --output=tmp/issue160-ci/fixture-artifacts > tmp/issue160-ci/fixtures.log 2>&1
      - name: WebKit recovery and engine smoke
        if: always()
        run: |
          npm run test:browser-smoke > tmp/issue160-ci/engine.log 2>&1
          PLAYWRIGHT_JSON_OUTPUT_FILE=tmp/issue160-ci/webkit.json npx playwright test -c playwright.device-acceptance.config.ts tests/run-progression.spec.ts tests/dungeon-lifecycle.spec.ts --grep 'resume|recovery|keyboard|read-only' --reporter=line,json --output=tmp/issue160-ci/webkit-artifacts > tmp/issue160-ci/webkit.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue160-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/issue160-ci/
          retention-days: 30
          if-no-files-found: warn
