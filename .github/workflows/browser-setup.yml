name: Browser setup smoke
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tactics-browser-exclusive
  cancel-in-progress: false
jobs:
  browser-setup:
    if: github.ref != 'refs/heads/branch/issue-263-runner-diagnosis'
    runs-on: [self-hosted, tactics-browser]
    timeout-minutes: 20
    steps:
      - name: Check host disposition before browser setup
        run: test ! -f "$RUNNER_TOOL_CACHE/issue208-unsafe-host"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # OS libraries are provisioned once by the runner administrator.
      - run: npm run setup:browsers
      - run: npm run check:browsers
      - run: node --test tests/tooling/browser-diagnostics.test.mjs
      - run: npm run build
      - run: npm run test:browser-smoke -- --diagnostics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-setup-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            verification-receipts/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
  issue263-diagnosis:
    if: github.ref == 'refs/heads/branch/issue-263-runner-diagnosis'
    runs-on: [self-hosted, tactics-browser]
    timeout-minutes: 40
    steps:
      - name: Check qualified host disposition
        run: test ! -f "$RUNNER_TOOL_CACHE/issue208-unsafe-host"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preserve only the diagnostic test overlay
        run: |
          mkdir -p "$RUNNER_TEMP/issue263-${{ github.run_id }}"
          cp tests/helpers/startupDiagnostics.ts tests/tooling/browser-diagnostics.test.mjs "$RUNNER_TEMP/issue263-${{ github.run_id }}/"
          cp scripts/issue263-native-capture.py "$RUNNER_TEMP/issue263-${{ github.run_id }}/"
          cp scripts/issue263-linux-inventory.py "$RUNNER_TEMP/issue263-${{ github.run_id }}/"
      - uses: actions/checkout@v4
        with:
          ref: e3e9ebf11aff78d395f65df6c3f74cded6733e83
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run setup:browsers && npm run check:browsers
      - name: Install the observer without changing original test bodies
        run: |
          cp "$RUNNER_TEMP/issue263-${{ github.run_id }}/startupDiagnostics.ts" tests/helpers/
          cp "$RUNNER_TEMP/issue263-${{ github.run_id }}/browser-diagnostics.test.mjs" tests/tooling/
          python3 - <<'PY'
          from pathlib import Path
          file=Path('tests/dungeon-exploration.spec.ts')
          old="import { expect,test } from '@playwright/test';"
          text=file.read_text()
          new="import { expect,test } from './helpers/startupDiagnostics';"
          if old in text:
              assert text.count(old)==1
              file.write_text(text.replace(old,new,1))
          else:
              assert text.count(new)==1
          PY
          mkdir -p verification-receipts/issue263
          git rev-parse HEAD > verification-receipts/issue263/runtime-source.txt
          git diff --stat > verification-receipts/issue263/overlay.txt
          sha256sum tests/helpers/startupDiagnostics.ts tests/tooling/browser-diagnostics.test.mjs tests/dungeon-exploration.spec.ts package-lock.json > verification-receipts/issue263/input-hashes.txt
      - run: npm run build
      - run: node --test --test-name-pattern='dungeon startup evidence' tests/tooling/browser-diagnostics.test.mjs
      - name: Use external event capture without early page script injection
        run: |
          python3 "$RUNNER_TEMP/issue263-${{ github.run_id }}/issue263-native-capture.py" tests/helpers/startupDiagnostics.ts
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          flags=['PW_TEST_REUSE_CONTEXT','PW_TEST_CONNECT_WS_ENDPOINT','PWDEBUG']
          Path('verification-receipts/issue263/mode-presence.json').write_text(json.dumps({name:bool(os.environ.get(name)) for name in flags},indent=2))
          PY
          sha256sum tests/helpers/startupDiagnostics.ts > verification-receipts/issue263/observer-free-input.txt
      - name: Record native components and memory before application checks
        run: python3 "$RUNNER_TEMP/issue263-${{ github.run_id }}/issue263-linux-inventory.py" verification-receipts/issue263/native-before.json
      - name: Original exploration order with bounded startup evidence
        # Keep the embedded startup-budget case in its ordinary untraced mode.
        run: npm run test:browser -- -c playwright.exploration.config.ts tests/dungeon-exploration.spec.ts -g 'map markers respect|stairs remain visible|stairs travel once per entry' --repeat-each=5 --max-failures=2
      - name: Restore the full observer for traced stair repetitions
        run: |
          cp "$RUNNER_TEMP/issue263-${{ github.run_id }}/startupDiagnostics.ts" tests/helpers/
          sha256sum tests/helpers/startupDiagnostics.ts > verification-receipts/issue263/full-observer-input.txt
      - name: Bounded stair repetitions with failure traces
        run: npm run test:browser -- --diagnostics -c playwright.exploration.config.ts tests/dungeon-exploration.spec.ts -g 'stairs travel once per entry' --repeat-each=5 --max-failures=2
      - name: Preserve native component and memory outcome
        if: always()
        run: python3 "$RUNNER_TEMP/issue263-${{ github.run_id }}/issue263-linux-inventory.py" verification-receipts/issue263/native-after.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue263-diagnosis-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification-receipts/
          retention-days: 30
          if-no-files-found: warn
