name: PR 274 affected browser verification
on:
  push:
    branches: [cursor/deterministic-dungeon-seeds-308b]
    paths: [.github/workflows/pr274-readiness.yml]
permissions:
  contents: read
concurrency:
  group: tactics-browser-tactics-browser-01
  queue: max
  cancel-in-progress: false
jobs:
  affected:
    runs-on: [self-hosted, tactics-browser, tactics-browser-01]
    timeout-minutes: 60
    steps:
      - name: Check host disposition
        run: test ! -f "$RUNNER_TOOL_CACHE/issue208-unsafe-host"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run setup:browsers
      - run: npm run build
      - name: Affected Chromium consumers
        run: npx playwright test -c playwright.regression.config.ts tests/dungeon.spec.ts tests/dungeon-exploration.spec.ts tests/dungeon-lifecycle.spec.ts tests/main-menu.spec.ts tests/guarded-effects.spec.ts tests/public-asset-base.spec.ts --reporter=line,json --output=verification-receipts/pr274/chromium-artifacts
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: verification-receipts/pr274/chromium.json
      - name: Affected WebKit consumers
        if: success() || failure()
        run: npx playwright test -c playwright.exploration.config.ts --reporter=line,json --output=verification-receipts/pr274/webkit-artifacts
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: verification-receipts/pr274/webkit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr274-readiness-${{ github.run_id }}
          path: verification-receipts/pr274/
          retention-days: 14
